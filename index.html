<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Plan 2D Clean — Grand</title>
<meta name="plan2d-build" content="t644" />
<style>
  :root {
    --bg:#161513; --panel:#1c1b19; --ink:#eceae6; --muted:#8a8680;
    --line:#2c2a26; --soft:#242220; --accent:#c9a227; --mapbg:#121110;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column;
  }
  .top {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 12px; border-bottom:1px solid var(--line); background:var(--panel);
    flex-shrink:0;
  }
  .top strong { font-size:14px; letter-spacing:.05em; font-weight:700; }
  .ui-tog { display:flex; gap:2px; align-items:center; }
  .rail-mapdock .ui-tog button { height:28px; padding:0 8px; font-size:11px; }
  .ui-tog button {
    background:transparent; color:var(--muted); border:1px solid transparent;
    border-radius:6px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .ui-tog button:hover { color:var(--ink); background:var(--soft); }
  .ui-tog button.on { color:var(--ink); border-color:var(--line); background:var(--soft); }
  .shell { flex:1; display:flex; min-height:0; }
  .rail {
    /* proto type chips need width — OK for prototype */
    width:min(340px, 28vw); min-width:min(340px, 42vw); flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); padding:14px 14px 16px;
    display:flex; flex-direction:column; gap:12px; overflow:auto;
  }
  .rail-pane { display:none; flex-direction:column; gap:8px; flex:1; min-height:0; }
  .rail-pane.on { display:flex; }
  .door { display:flex; flex-direction:column; gap:3px; }
  .door label, .tiny-lab {
    font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); font-weight:650;
  }
  .door input, .door select, .act-row input, .act-row select {
    width:100%; background:var(--soft); color:var(--ink);
    border:1px solid var(--line); border-radius:8px;
    padding:12px 12px; font-size:18px;
  }
  .door input:focus, .door select:focus, .act-row input:focus, .act-row select:focus {
    outline:1px solid #4a463e;
  }
  .fixed {
    padding:12px; border:1px solid var(--line); border-radius:8px;
    background:#1a1917; color:var(--muted); font-size:18px;
  }
  .quiet-btn, .kit-list button, .sec button, .seg button, .step button {
    background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:10px 12px; font-size:15px; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .quiet-btn:hover, .kit-list button:hover, .sec button:hover, .seg button:hover, .step button:hover {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .quiet-btn.on { color:var(--accent); border-color:#3f3820; background:#221e14; }
  .rail-tools { display:flex; flex-wrap:wrap; gap:3px; padding-top:4px; border-top:1px solid var(--line); }
  .add-wrap { position:relative; }
  .add-wrap > summary {
    list-style:none; cursor:pointer; font-size:15px; color:#b8b4ac;
    padding:10px 12px; border-radius:8px; border:1px solid transparent; user-select:none;
  }
  .add-wrap > summary::-webkit-details-marker { display:none; }
  .add-wrap > summary:hover, .add-wrap[open] > summary {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .kit-pop {
    position:absolute; left:0; right:0; top:100%; z-index:30;
    margin-top:4px; padding:4px; background:#1a1917;
    border:1px solid var(--line); border-radius:8px;
    display:flex; flex-direction:column; gap:1px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .kit-list { display:flex; flex-direction:column; gap:1px; }
  .kit-list.tiny button { font-size:15px; padding:8px 10px; color:#c4c0b8; }
  .kit-list button.armed, .kit-pop button.armed { color:var(--accent); }
  .kit-pop button { width:100%; background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:10px 12px; font-size:15px; cursor:pointer; text-align:left; }
  .kit-pop button:hover { background:var(--soft); color:var(--ink); }
  .act-row {
    display:flex; flex-direction:column; gap:4px; padding:7px 8px;
    border:1px solid var(--line); border-radius:8px; background:#191816;
  }
  .act-row .q { font-size:16px; font-weight:650; color:var(--ink); }
  .card {
    padding:14px; border:1px solid var(--line); border-radius:12px; background:#191816;
    display:flex; flex-direction:column; gap:12px;
  }
  .card .sum { font-size:18px; font-weight:650; line-height:1.3; }
  .card .sum span { color:var(--accent); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { font-size:16px; width:34px; height:34px; text-align:center; border:1px solid var(--line); background:var(--soft); }
  .step .n { font-size:28px; font-weight:700; min-width:2.2em; text-align:center; }
  .seg { display:flex; flex-wrap:wrap; gap:3px; }
  .seg button { border:1px solid var(--line); padding:5px 8px; }
  .seg button.on { color:var(--ink); background:var(--soft); border-color:#4a463e; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button {
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    background:transparent; color:#b8b4ac; font-size:15px; cursor:pointer;
  }
  .chips button.on { color:var(--ink); background:var(--soft); border-color:#4a463e; }
  .staff { margin-top:4px; padding-top:6px; border-top:1px solid var(--line); }
  .status-line { margin-top:auto; font-size:14px; color:var(--accent); min-height:1.2em; line-height:1.35; }
  .count { font-size:15px; color:var(--muted); font-weight:650; }
  .mapwrap { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--mapbg); }
  .sec { display:none; }
  .rail-mapdock {
    margin-top:auto; flex-shrink:0; padding-top:10px;
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px;
  }
  .rail-mapdock .map-acts {
    display:flex; flex-wrap:wrap; gap:3px;
  }
  .rail-mapdock .map-acts button {
    background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:8px 10px; font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .rail-mapdock .map-acts button:hover {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .rail-mapdock .map-acts .sep { width:1px; height:18px; background:var(--line); margin:0 2px; align-self:center; }
  .rail-mapdock .zoom-bar {
    display:flex; gap:6px; align-items:center; justify-content:flex-start;
    padding:0;
  }
  .rail-mapdock .ui-tog { flex-wrap:wrap; }
  .rail-mapdock .ui-tog button { height:28px; padding:0 8px; font-size:11px; }
  .stage {
    flex:1; min-height:0; display:flex; align-items:stretch; justify-content:stretch;
    padding:0; overflow:hidden;
  }
  svg#plan {
    background:#e8e2d8; border-radius:0; touch-action:none;
    width:100%; height:100%; display:block;
  }
  .zoom-bar button { width:36px; height:32px; border-radius:8px; border:1px solid #3a3834; background:#242220; color:var(--ink); font-weight:800; font-size:16px; line-height:1; cursor:pointer; }
  .zoom-bar span { color:var(--muted); font-size:11px; min-width:3.5em; text-align:center; }

  .rail-field { cursor: grab; position: relative; touch-action: none; }
  .rail-field.dragging { opacity: 0.55; cursor: grabbing; }
  .rail-field.drag-over { outline: 1px dashed #8a8680; outline-offset: 2px; border-radius: 8px; }
  .rail-field::before { content: "⋮⋮"; position: absolute; left: -2px; top: 50%; transform: translateY(-50%); font-size: 9px; color: #6a6660; letter-spacing: -2px; opacity: 0.55; pointer-events: none; }

  .myui-hint { color:var(--muted); font-size:12px; line-height:1.35; padding:6px 2px 10px; }
  .myui-hint strong { color:var(--ink); font-weight:700; }
  .ctx-menu {
    position:fixed; z-index:50; min-width:180px; padding:4px;
    background:#2a2825; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .ctx-menu button {
    display:block; width:100%; text-align:left; border:0; background:transparent;
    color:var(--ink); font:inherit; font-size:13px; font-weight:600;
    padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .ctx-menu button:hover { background:var(--soft); }
  .ctx-menu .sec-lab { padding:8px 10px 2px; color:#8a8680; font-size:10px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .ctx-menu .sec-lab:first-child { padding-top:4px; }

  /* Prototype: type chips ON each left-rail row (Al: knobs on the thing) */
  .rail { width: min(400px, 48vw) !important; min-width: 320px !important; }
  .door.rail-field, .act-row.rail-field, .rail-field[data-field], .type-row {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) auto !important;
    flex-direction: unset !important;
    align-items: center !important;
    column-gap: 8px !important;
    row-gap: 3px !important;
  }
  .door.rail-field > label, .door.rail-field > input, .door.rail-field > select, .door.rail-field > .fixed,
  .act-row.rail-field > .q, .act-row.rail-field > input, .act-row.rail-field > select, .act-row.rail-field > .fixed,
  .rail-field > label, .rail-field > .q, .rail-field > .tiny-lab, .rail-field > input, .rail-field > select,
  .rail-field > .fixed, .rail-field > .step, .rail-field > div:not(.field-type),
  .type-row > .type-row-main, .type-row > summary, .type-row > .quiet-btn {
    grid-column: 1 !important;
    min-width: 0;
  }
  .field-type {
    grid-column: 2 !important;
    grid-row: 1 / span 12 !important;
    align-self: center !important;
    display: flex !important;
    flex-direction: row !important;
    gap: 3px !important;
    z-index: 6;
  }
  .field-type button {
    height: 26px !important; min-width: 28px !important; padding: 0 6px !important;
    border-radius: 7px !important; border: 1px solid #5a5650 !important;
    background: #2e2c28 !important; color: #f0ebe3 !important;
    font-size: 11px !important; font-weight: 800 !important; cursor: pointer !important;
  }
  .field-type button.on { border-color: #c9a227 !important; color: #c9a227 !important; }
  .field-type .px {
    min-width: 2.1em; text-align: center; font-size: 12px !important; font-weight: 800 !important;
    color: var(--accent) !important; line-height: 26px; padding: 0 2px; user-select: none;
  }

  .build-big {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px dashed #5a5650; background: #1a1917;
    font-size: 36px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--accent); text-align: center; line-height: 1.2;
  }
  .build-big small { display:block; font-size:11px; font-weight:650; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:2px; }

  .owner-tag {
    font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); padding: 2px 2px 6px;
  }
</style>
</head>

<div class="top"><strong>GRAND · PLAN 2D</strong>
</div>
<div class="shell">
  <aside class="rail" aria-label="Essentials">

        <select class="sync-style">
          <option value="banquet" selected>Banquet</option>
          <option value="banquet-s1">Banquet · 1 stage</option>
          <option value="banquet-s2">Banquet · 2 stage</option>
          <option value="banquet-s3">Banquet · 3 stage</option>
          <option value="banquet-s1-dance">Banquet · 1 stage + dance</option>
          <option value="banquet-s2-dance">Banquet · 2 stage + dance</option>

          <option value="classroom">Classroom</option>

      <div class="door rail-field" draggable="true" data-field="room"><label>Room</label><div class="fixed">Grand</div></div>
      <details class="add-wrap kit-details"><summary>Add…</summary><div class="kit-pop" data-kit-host></div></details>
      <div class="rail-tools">
        <button type="button" class="quiet-btn liveMaxBtn">Live max</button>
        <button type="button" class="quiet-btn maxPackBtn">Max PAX</button>
        <button type="button" class="quiet-btn screenKeepBtn" aria-pressed="false">Screen keep · off</button>
        <button type="button" class="quiet-btn clearBtn">Clear room</button>
      </div>
      <div class="count tableCount"></div>
      <div class="status-line status"></div>

    <!-- UI2 Plain action rows -->

        <select class="sync-style">

        <div class="door rail-field" draggable="true" data-field="date"><label>Date</label><input class="sync-date" type="date" /></div>

    <!-- UI6 Ebby — UI1 standard, order+type saved per person -->

function tablesNeeded(){

function updateCounts(){
  const n = items.filter(i=>i.kind==='move'&&i.type==='round').length;
  const need = tablesNeeded();
  const p = parseInt(brief.people, 10);
  let text = '';

    text = 'Guests '+p+' · '+n+' tables';

    text = n + ' tables · Max PAX sets guests';

  document.querySelectorAll('.tableCount').forEach(el=>{ el.textContent = text; });
}
/** Match unlocked banquet tables to ceil(people/10). Adds when guests rise; trims unlocked extras when guests fall. Locks + permanents untouched. */
function syncTablesToPeople(){
  // Guests acts like Max PAX: dense-pack up to ceil(guests/10)
  const need = tablesNeeded();
  const p = parseInt(brief.people, 10);
  if (!need){ updateCounts(); return; }
  const kept = items.filter(i=>i.kind==='permanent' || isLocked(i));
  items = kept.slice();
  const solids = packSolidsFromItems();
  const lockedPts = kept.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  // Aim high, then keep only `need` densest-first results
  let placed = packHexSync(solids, lockedPts, {
    gapStep: screenKeepOn ? 0.32 : 0.22,
    target: Math.max(need + 6, 24)
  });
  if (placed.length > need) placed = placed.slice(0, need);
  for (const pt of placed){
    seq++;
    items.push({ id:'t'+seq, kind:'move', type:'round', x:pt.x, z:pt.z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
  }
  pruneIllegalTables();
  const n = renumberTables();
  render();
  if (n < need) setStatus(p+' guests need '+need+' tables · floor fit '+n);
  else setStatus(p+' guests · '+n+' tables packed');
}

const KIT_ITEMS = [

function makeStageDeck(id, x, z){
  return { id, kind:'permanent', type:'stage', group:null, x, z, w:STAGE_DECK.w, d:STAGE_DECK.d, label:'Stage', locked:false };
}
const STAGE_Z = 1.6;
const STAGE_GAP = 0.02;
const deckPitch = STAGE_DECK.w + STAGE_GAP;
let items = []; // empty room — place stage/dance via Style (Banquet · …)


function isLocked(it){ return !!it.locked; }
function packableMove(){ return items.filter(i=>i.kind==='move' && !isLocked(i)); }
function lockedAsSolid(){ return items.filter(i=>isLocked(i)); }

function bodySize(it){
  if (it.type === 'round') return { w: BODY_D, d: BODY_D };
  return { w: it.w, d: it.d };
}
function aabb(it){
  const s = bodySize(it);
  return { x:it.x - s.w/2, z:it.z - s.d/2, w:s.w, d:s.d };
}
function inflate(b,p){ return { x:b.x-p, z:b.z-p, w:b.w+2*p, d:b.d+2*p }; }
function overlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.z < b.z+b.d && a.z+a.d > b.z;
}
function mtv(a,b){
  const ox1=(a.x+a.w)-b.x, ox2=(b.x+b.w)-a.x, oz1=(a.z+a.d)-b.z, oz2=(b.z+b.d)-a.z;
  if (ox1<=0||ox2<=0||oz1<=0||oz2<=0) return {dx:0,dz:0};
  const ox = ox1 < ox2 ? -ox1 : ox2;
  const oz = oz1 < oz2 ? -oz1 : oz2;
  return Math.abs(ox) < Math.abs(oz) ? {dx:ox,dz:0} : {dx:0,dz:oz};
}
function pointInPoly(px,pz,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], zi=poly[i][1], xj=poly[j][0], zj=poly[j][1];
    if (((zi>pz)!==(zj>pz)) && (px < (xj-xi)*(pz-zi)/(zj-zi)+xi)) inside=!inside;
  }
  return inside;
}
function boxInPerimeter(b){
  const pts=[[b.x,b.z],[b.x+b.w,b.z],[b.x+b.w,b.z+b.d],[b.x,b.z+b.d]];
  return pts.every(p => pointInPoly(p[0],p[1],ROOM));
}
function circleInPerimeter(cx,cz,r){
  const n=16;
  for(let i=0;i<n;i++){
    const a=i*Math.PI*2/n;
    if (!pointInPoly(cx+Math.cos(a)*r, cz+Math.sin(a)*r, ROOM)) return false;
  }
  return pointInPoly(cx,cz,ROOM);
}
function circleHitsAabb(cx,cz,r,b){
  const nx=Math.max(b.x, Math.min(cx, b.x+b.w));
  const nz=Math.max(b.z, Math.min(cz, b.z+b.d));
  const dx=cx-nx, dz=cz-nz;
  return dx*dx+dz*dz < (r+PAD)*(r+PAD);
}
function doorKeepBoxes(){
  return DOORS.map(d=>{
    const ax=d.a[0], az=d.a[1], bx=d.b[0], bz=d.b[1];
    const keep = d.kind==='fire' ? FIRE_KEEP : DOOR_KEEP_GUEST;
    const horiz = Math.abs(az-bz) < 0.05;
    if (horiz){
      const x0=Math.min(ax,bx), x1=Math.max(ax,bx);
      return { x:x0, z:az, w:x1-x0, d:keep, kind:d.kind };
    }
    const z0=Math.min(az,bz), z1=Math.max(az,bz);
    const x = ax > 0 ? ax - keep : ax;
    return { x, z:z0, w:keep, d:z1-z0, kind:d.kind };
  });
}
function clampIntoRoom(it){
  const s=bodySize(it);
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const minX=Math.min(...xs)+s.w/2+PAD, maxX=Math.max(...xs)-s.w/2-PAD;
  const minZ=Math.min(...zs)+s.d/2+PAD, maxZ=Math.max(...zs)-s.d/2-PAD;
  it.x=Math.min(Math.max(it.x,minX),maxX);
  it.z=Math.min(Math.max(it.z,minZ),maxZ);
}
function solidsFor(it, opts={}){
  const out=[];
  HOLES.forEach(h => out.push({ x:h.x-h.w/2, z:h.z-h.d/2, w:h.w, d:h.d }));
  doorKeepBoxes().forEach(b => out.push(b));
  // Screen keep: strip SCREEN_FRONT into room from each bar (banquet)
  SCREENS.forEach(s => {
    out.push({ x:s.x-s.w/2, z:s.z-s.d/2, w:s.w, d:s.d });
    // into room = −Z; depth 0 when Screen keep is off (banquet closer)
    const keepD = screenKeepDepth();
    if (keepD > 0) out.push({ x:s.x-s.w/2, z:s.z - keepD, w:s.w, d:keepD });
  });
  items.forEach(o => {
    if (o.id===it.id) return;
    if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) return;
    if (it.group && o.group && it.group===o.group) return;
    // Lectern may sit on stage — no collision either way
    if (it.type==='lectern' && o.type==='stage') return;
    if (it.type==='stage' && o.type==='lectern') return;
    if (o.type==='round' && !isLocked(o)) return;
    // locked rounds act as solids for packing around
    if (o.type==='round' && isLocked(o)) {
      out.push({ x:o.x-BODY_R, z:o.z-BODY_R, w:BODY_D, d:BODY_D });
      return;
    }
    out.push(aabb(o));
  });
  return out;
}
function canStackOnStage(a,b){
  return (a.type==='lectern' && b.type==='stage') || (a.type==='stage' && b.type==='lectern');
}
function isLegal(it, opts={}){
  if (it.type==='round'){
    const r=BODY_R;
    // Wall aisle: outer chair ring stays WALL_AISLE inside perimeter
    if (!circleInPerimeter(it.x, it.z, r+WALL_AISLE)) return false;
    for (const s of solidsFor(it, opts)) {
      if (circleHitsAabb(it.x, it.z, r, s)) return false;
    }
    for (const o of items){
      if (o.id===it.id) continue;
      if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) continue;
      if (o.type!=='round') continue;
      const dx=it.x-o.x, dz=it.z-o.z;
      if (dx*dx+dz*dz < MIN_C2C*MIN_C2C) return false;
    }
    return true;
  }
  const b=inflate(aabb(it), PAD);
  if (!boxInPerimeter(b)) return false;
  for (const s of solidsFor(it, opts)) {
    if (overlap(b, inflate(s, PAD))) return false;
  }
  for (const o of items){
    if (o.id===it.id) continue;
    if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) continue;
    if (it.group && o.group && it.group===o.group) continue;
    if (o.type!=='round') continue;
    if (circleHitsAabb(o.x,o.z,BODY_R, b)) return false;
  }
  return true;
}

function pushOutSelf(it, opts={}){
  let cur={...it};
  for (let iter=0; iter<=32; iter++){
    if (isLegal(cur, opts)) return cur;
    let moved=false;
    if (cur.type==='round'){
      for (const s of solidsFor(cur, opts)) {
        if (!circleHitsAabb(cur.x,cur.z,BODY_R, s)) continue;
        const cx=s.x+s.w/2, cz=s.z+s.d/2;
        const nx=Math.max(s.x, Math.min(cur.x, s.x+s.w));
        const nz=Math.max(s.z, Math.min(cur.z, s.z+s.d));
        let dx=cur.x-nx, dz=cur.z-nz;
        let len=Math.hypot(dx,dz);
        if (len < 1e-6){ dx=cur.x-cx; dz=cur.z-cz; len=Math.hypot(dx,dz)||1; }
        const clear = BODY_R + PAD;
        const push = clear - len + 0.001;
        if (push > 0){
          cur={...cur, x:cur.x+(dx/len)*push, z:cur.z+(dz/len)*push};
          moved=true;
        }
      }
      for (const o of items){
        if (o.id===cur.id || o.type!=='round') continue;
        if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) continue;
        let dx=cur.x-o.x, dz=cur.z-o.z;
        let dist=Math.hypot(dx,dz);
        if (dist >= MIN_C2C) continue;
        if (dist < 1e-4){ dx=1; dz=0; dist=1; }
        const push = MIN_C2C - dist + 0.001;
        cur={...cur, x:cur.x+(dx/dist)*push, z:cur.z+(dz/dist)*push};
        moved=true;
      }
    } else {
      const b=inflate(aabb(cur), PAD);
      for (const s of solidsFor(cur, opts)) {
        const sb=inflate(s, PAD);
        if (!overlap(b, sb)) continue;
        const m=mtv(b, sb);
        cur={...cur, x:cur.x+m.dx, z:cur.z+m.dz};
        moved=true;
      }
      for (const o of items){
        if (o.id===cur.id || o.type!=='round') continue;
        if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) continue;
        const rb={ x:o.x-BODY_R, z:o.z-BODY_R, w:BODY_D, d:BODY_D };
        if (!overlap(b, inflate(rb,PAD))) continue;
        const m=mtv(b, inflate(rb,PAD));
        cur={...cur, x:cur.x+m.dx, z:cur.z+m.dz};
        moved=true;
      }
    }
    if (!isLegal(cur, opts)) clampIntoRoom(cur);
    if (!moved) break;
  }
  return isLegal(cur, opts) ? cur : null;
}

function yieldOverlappingOnly(perm){
  // One pass: push once or drop — no fine-grid search, no bounce loops
  const mov=items.filter(i=>i.kind==='move' && !isLocked(i));
  for (const m of mov){
    if (isLegal(m)) continue;
    const pushed=pushOutSelf(m);
    if (pushed){ m.x=pushed.x; m.z=pushed.z; }
  }
  pruneIllegalTables();
}
function yieldForPermanents(perms){
  for (const p of perms) yieldOverlappingOnly(p);
}
/** One pairwise separate + prune. No findFreeSlot. */
function untangleTables(){
  const mov=items.filter(i=>i.kind==='move' && i.type==='round' && !isLocked(i));
  for (let i=0;i<mov.length;i++){
    for (let j=i+1;j<mov.length;j++){
      const a=mov[i], b=mov[j];
      const dx=a.x-b.x, dz=a.z-b.z;
      let dist=Math.hypot(dx,dz);
      if (dist >= MIN_C2C) continue;
      if (dist < 1e-4){ a.x -= MIN_C2C/2; b.x += MIN_C2C/2; }
      else {
        const push=(MIN_C2C-dist)/2 + 0.001;
        a.x += (dx/dist)*push; a.z += (dz/dist)*push;
        b.x -= (dx/dist)*push; b.z -= (dz/dist)*push;
      }
    }
  }
  for (const m of mov){
    if (isLegal(m)) continue;
    const pushed=pushOutSelf(m);
    if (pushed){ m.x=pushed.x; m.z=pushed.z; }
  }
  pruneIllegalTables();
}
function pruneIllegalTables(){
  const kept=[];
  for (const it of items){
    if (it.kind==='move' && it.type==='round' && !isLocked(it) && !isLegal(it)) continue;
    kept.push(it);
  }
  items=kept;
}
/** Coarse slot only — never nested fine grids (Safari freeze). */
function findFreeSlot(w,d,exceptId){
  const margin = BODY_R + WALL_AISLE;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const minX=Math.min(...xs)+margin, maxX=Math.max(...xs)-margin;
  const minZ=Math.min(...zs)+margin, maxZ=Math.max(...zs)-margin;
  const tryAt=(x,z)=>{
    const cand={ id:exceptId||('tmp'+x+z), kind:'move', type:'round', x, z, w:TABLE_D, d:TABLE_D, label:'', locked:false };
    return isLegal(cand) ? {x,z} : null;
  };
  const step=0.4;
  for (const oz of [0, step/2]){
    for (const ox of [0, step/2]){
      for (let z=minZ+oz; z<=maxZ+1e-9; z+=step){
        for (let x=minX+ox; x<=maxX+1e-9; x+=step){
          const hit=tryAt(x,z); if (hit) return hit;
        }
      }
    }
  }
  return null;
}
/** Prefer exact click, then nudge/spiral near it — same legality as Add table button. */
function findFreeSlotNear(x0, z0, maxR){
  if (maxR == null) maxR = 3.2;
  const tryAt=(x,z)=>{

  const pushed=pushOutSelf({ id:'tmpNear', kind:'move', type:'round', x:x0, z:z0, w:TABLE_D, d:TABLE_D, label:'', locked:false });
  if (pushed) return {x:pushed.x, z:pushed.z};
  const step=0.18;
  for (let r=step; r<=maxR+1e-9; r+=step){
    const n = Math.max(12, Math.round(24 * r));
    for (let i=0; i<n; i++){
      const a = (i / n) * Math.PI * 2;

function tidyLayout(mode, quiet){
  // Rearrange unlocked tables only. NEVER overlap. NEVER drop. Abort→restore if impossible.
  const snapshot = items.map(i=>({...i}));
  const movables = packableMove().map(m=>({...m}));
  if (!movables.length){ if(!quiet) setStatus('Nothing to tidy'); return; }
  const kept = items.filter(i=>i.kind==='permanent' || isLocked(i));
  const n = movables.length;
  const c2c = MIN_C2C;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const left=Math.min(...xs)+BODY_R+WALL_AISLE, right=Math.max(...xs)-BODY_R-WALL_AISLE;
  const bottom=Math.min(...zs)+BODY_R+Math.max(DOOR_KEEP_GUEST, WALL_AISLE);
  const top=Math.max(...zs)-BODY_R-WALL_AISLE;
  const usableW=Math.max(c2c, right-left), usableH=Math.max(c2c, top-bottom);
  const stagger = mode==='staggered';
  // Fit N into a real C2C grid that fits the room (not a cramped N-pack that spills)
  let cols = Math.max(1, Math.floor(usableW / c2c) + 1);
  let rows = Math.max(1, Math.ceil(n / Math.max(1, cols - (stagger?0:0))));
  // Prefer more columns if room is wide
  cols = Math.min(cols, Math.max(1, Math.ceil(Math.sqrt(n * usableW / usableH))));
  rows = Math.max(1, Math.ceil(n / cols));
  // Grow grid until we have >= n slot centres spaced by c2c
  const slots=[];
  function buildSlots(C, R){
    const out=[];
    const blockW=(C-1)*c2c, blockH=(R-1)*c2c;
    const x0=left+(usableW-blockW)/2, z0=top-(usableH-blockH)/2;
    for (let r=0;r<R;r++){
      const rowShift = stagger && (r%2===1) ? c2c/2 : 0;
      const rowCols = stagger && (r%2===1) ? Math.max(1, C-1) : C;
      for (let c=0;c<rowCols;c++) out.push({ x:x0+rowShift+c*c2c, z:z0-r*c2c });
    }
    return out;
  }
  let C=cols, R=rows;
  for (let grow=0; grow<20; grow++){
    slots.length=0;
    slots.push(...buildSlots(C,R));
    if (slots.length >= n) break;
    if (C * c2c <= usableW + c2c) C++; else R++;
  }
  movables.sort((a,b)=>String(a.label).localeCompare(String(b.label), undefined, {numeric:true}));
  const used=new Set();
  const placed=[];
  function allLegalList(list){
    items = kept.concat(list);
    return list.every(t => isLegal(t));
  }
  for (const m of movables){
    let cand=null;
    for (let i=0;i<slots.length;i++){
      if (used.has(i)) continue;
      const tryP={...m, x:slots[i].x, z:slots[i].z};
      items=kept.concat(placed);
      if (isLegal(tryP)){ cand=tryP; used.add(i); break; }
    }
    if (!cand){
      items=kept.concat(placed);
      const slot=findFreeSlot(TABLE_D, TABLE_D, m.id);
      if (slot){
        const tryP={...m, x:slot.x, z:slot.z};
        if (isLegal(tryP)) cand=tryP;
      }
    }
    if (!cand){
      items=kept.concat(placed);
      const orig={...m};
      if (isLegal(orig)) cand=orig;
    }
    if (!cand){
      // Impossible without overlap — restore and stop
      items = snapshot;
      if (!quiet){ render(); setStatus('Tidy aborted · would stack — left as-was'); }
      return;
    }
    placed.push(cand);
  }
  if (placed.length !== n || !allLegalList(placed)){
    items = snapshot;
    if (!quiet){ render(); setStatus('Tidy aborted · overlap check failed'); }
    return;
  }
  items = kept.concat(placed);
  renumberTables();
  // Final pairwise proof
  const rounds = items.filter(i=>i.kind==='move'&&i.type==='round');
  for (let i=0;i<rounds.length;i++){
    for (let j=i+1;j<rounds.length;j++){
      const dx=rounds[i].x-rounds[j].x, dz=rounds[i].z-rounds[j].z;
      if (dx*dx+dz*dz < MIN_C2C*MIN_C2C - 1e-9){
        items = snapshot;
        if (!quiet){ render(); setStatus('Tidy aborted · C2C fail'); }
        return;
      }
    }
  }
  if (!quiet){ render(); setStatus('Tidied · '+mode+' · '+placed.length+' tables · no overlap'); }
}
function shuffleMovables(quiet){
  const movables=packableMove().map(m=>({...m}));
  const kept=items.filter(i=>i.kind==='permanent' || isLocked(i));
  const placed=[];
  for (const m of movables){
    items=kept.concat(placed);
    let best=null;
    for (let r=0;r<=2;r++){
      for (let a=0;a<8;a++){
        const ang=a*Math.PI/4, rad=r*0.4;
        const cand={...m, x:m.x+Math.cos(ang)*rad, z:m.z+Math.sin(ang)*rad};
        if (isLegal(cand)){ best=cand; break; }
      }
      if (best) break;
    }
    if (!best){
      const pushed=pushOutSelf(m);
      if (pushed) best=pushed;
    }
    if (!best){ const slot=findFreeSlot(m.w,m.d,m.id); if(slot) best={...m,...slot}; }
    if (best) placed.push(best);
  }
  items=kept.concat(placed);
  renumberTables();
  if (!quiet){ render(); setStatus('Shuffled'); }
}

let drag=null;

function svgPoint(evt){

function decksFlush(a,b,slop){
  slop = slop==null ? 0.1 : slop;

function recomputeStageGroups(){
  const decks=items.filter(i=>i.type==='stage');
  const parent={};
  decks.forEach(d=>parent[d.id]=d.id);
  function find(id){ return parent[id]===id ? id : (parent[id]=find(parent[id])); }
  function join(a,b){ a=find(a); b=find(b); if(a!==b) parent[b]=a; }
  for (let i=0;i<decks.length;i++){
    for (let j=i+1;j<decks.length;j++){
      if (decksFlush(decks[i], decks[j])) join(decks[i].id, decks[j].id);
    }
  }
  const map={}; let n=0;
  for (const d of decks){
    const root=find(d.id);
    if (!map[root]){ n++; map[root]='stage-g'+n; }
    d.group = map[root];
  }

function snapStageDeck(it){
  if (it.type!=='stage') return false;
  const SNAP=0.32;
  const others=items.filter(o=>o.type==='stage' && o.id!==it.id);
  let best=null, bestDist=SNAP;
  for (const o of others){
    const cands=[
      {x:o.x+(o.w+it.w)/2, z:o.z},
      {x:o.x-(o.w+it.w)/2, z:o.z},
      {x:o.x, z:o.z+(o.d+it.d)/2},
      {x:o.x, z:o.z-(o.d+it.d)/2},
    ];
    for (const c of cands){
      const dist=Math.hypot(c.x-it.x, c.z-it.z);
      if (dist<bestDist){
        const trial={...it, x:c.x, z:c.z};
        if (isLegal(trial,{ignoreMove:true})){ bestDist=dist; best=c; }
      }
    }
  }
  if (!best) return false;
  it.x=best.x; it.z=best.z;

}
function stageUnderLectern(lec){
  return items.find(st => st.type==='stage'
    && Math.abs(lec.x - st.x) <= st.w/2 + 0.05
    && Math.abs(lec.z - st.z) <= st.d/2 + 0.05) || null;
}
function groupMembers(it){
  if (it.type==='stage'){
    const stages = !it.group ? [it] : items.filter(o=>o.type==='stage' && o.group===it.group);
    const g = it.group;
    const lects = items.filter(o=>{
      if (o.type!=='lectern' || !o.locked) return false;
      if (g && o.group===g) return true;
      if (!g && stageUnderLectern(o) && stageUnderLectern(o).id===it.id) return true;
      return false;
    });
    return stages.concat(lects);
  }
  if (!it.group) return [it];
  return items.filter(o=>o.group===it.group);

function toggleLock(it){
  // Stages/tables: lock in place. Lectern uses Lock/Unlock menu (ties to stage).
  if (it.type==='lectern'){
    if (it.locked) unlockLectern(it);
    else lockLectern(it);
    return;
  }
  const members=groupMembers(it).filter(m=>m.type!=='lectern');
  const next=!it.locked;
  members.forEach(m=>{ m.locked=next; });
  setStatus(next ? 'Locked · pack designs around' : 'Unlocked');
  render();
}
function lockLectern(it){
  const st = stageUnderLectern(it);
  it.locked = true;
  if (st){
    if (!st.group){
      const gid = 'sg'+Date.now().toString(36);
      // join flush decks into one group
      const mates = items.filter(o=>o.type==='stage' && (
        o.id===st.id || (o.group && o.group===st.group)
      ));
      // Prefer existing group on neighbouring joined decks
      recomputeStageGroups();
      const st2 = items.find(x=>x.id===st.id) || st;
      if (!st2.group){
        st2.group = gid;
        // pull flush neighbours already grouped by recompute — call again after assign
        items.filter(o=>o.type==='stage' && decksFlush(o, st2)).forEach(o=>{ o.group = gid; });
        recomputeStageGroups();
      }
      const st3 = items.find(x=>x.id===st.id) || st2;
      it.group = st3.group || gid;
      if (!st3.group) st3.group = it.group;
    } else {
      it.group = st.group;

    it.group = null;

function onDown(evt){

  evt.preventDefault(); evt.stopPropagation();
  const id=evt.currentTarget.dataset.id;
  const it=items.find(x=>x.id===id); if(!it) return;
  selectedId=id;

  const opts = lead.kind==='permanent' ? {ignoreMove:true} : {};
  let allOk=true;
  for (const m of members){ if (!isLegal(m, opts)){ allOk=false; break; } }
  if (allOk) drag.lastLegal = members.map(m=>({id:m.id,x:m.x,z:m.z}));
  if (lead.kind==='permanent') liveMaxPulse(members);
  render();
}
function settle(){
  clearTimeout(longPressTimer);
  if (!drag) return;
  const d=drag; drag=null;
  const it=items.find(x=>x.id===d.id); if(!it) return;
  if (isLocked(it)){ render(); return; }
  const members=groupMembers(it);
  const opts = it.kind==='permanent' ? {ignoreMove:true} : {};
  // One rule: if illegal on release → snap back to last legal pose (no spring / multi-pass)
  let illegal=false;
  for (const m of members){ if (!isLegal(m, opts)){ illegal=true; break; } }
  if (illegal){
    for (const ll of d.lastLegal){
      const m=items.find(x=>x.id===ll.id);
      if (m){ m.x=ll.x; m.z=ll.z; }
    }
  }
  if (it.type==='stage'){
    for (const m of groupMembers(it)) snapStageDeck(m);
    recomputeStageGroups();
    const joined=groupMembers(items.find(x=>x.id===it.id)||it).length;
    setStatus(joined>1 ? ('Stage snapped · '+joined+' decks move as one') : 'Stage deck');
  }
  if (it.kind==='permanent'){
    yieldForPermanents(groupMembers(it));
    if (liveMax){ pruneIllegalTables(); fillGapsHexOnce(); renumberTables(); setGuestsFromTables(); setStatus('Live max · settled'); }
    else if (it.type!=='stage') setStatus('Settled');
  } else if (it.kind==='move' && it.type==='round'){
    renumberTables(); // keep # geography after shove
  }
  render();
}

function renumberTables(){
  // Geography: top→bottom rows, left→right within row. Highest # = bottom-right.
  const mov = items.filter(i=>i.kind==='move' && i.type==='round');

    return a.x - b.x; // left → right
  });
  mov.forEach((m,i)=>{ m.label=String(i+1); });
  seq = Math.max(seq, mov.length);
  return mov.length;

/** Build solids for packing: built-ins + permanents + locked round AABBs. */
function packSolidsFromItems(){
  const out=[];
  HOLES.forEach(h => out.push({ x:h.x-h.w/2, z:h.z-h.d/2, w:h.w, d:h.d }));
  doorKeepBoxes().forEach(b => out.push(b));
  SCREENS.forEach(s => {
    out.push({ x:s.x-s.w/2, z:s.z-s.d/2, w:s.w, d:s.d });
    const keepD = screenKeepDepth();
    if (keepD > 0) out.push({ x:s.x-s.w/2, z:s.z - keepD, w:s.w, d:keepD });
  });
  items.forEach(o => {
    if (o.kind==='move' && o.type==='round' && !isLocked(o)) return;
    if (o.type==='round' && isLocked(o)) {
      out.push({ x:o.x-BODY_R, z:o.z-BODY_R, w:BODY_D, d:BODY_D });
      return;
    }
    if (o.kind==='permanent') out.push(aabb(o));
  });
  return out;
}

function packPointLegal(x, z, rounds, solids, exceptIdx){
  if (!circleInPerimeter(x, z, BODY_R + WALL_AISLE)) return false;
  for (const s of solids) if (circleHitsAabb(x, z, BODY_R, s)) return false;
  const need = MIN_C2C * MIN_C2C;
  for (let i=0;i<rounds.length;i++){
    if (i===exceptIdx) continue;
    const dx=x-rounds[i].x, dz=z-rounds[i].z;
    if (dx*dx+dz*dz < need) return false;
  }
  return true;
}

/**
 * Lean Max PAX (mirrors pack-math/maxpax-core.mjs):
 * proven BEST_SEED + gap/polish, else focused hex pitch 2.92/2.88 ang=0.
 */
const BEST_SEED = [
  {x:-9.9639,z:-0.0438},{x:-7.0723,z:-0.3594},{x:5.0349,z:0.4746},{x:-8.4548,z:-2.8874},
  {x:-5.546,z:-2.8022},{x:-3.3337,z:-0.9549},{x:-1.4533,z:-3.1386},{x:0.5073,z:-1.0104},
  {x:2.425,z:-3.3263},{x:5.2777,z:-2.3956},{x:8.1091,z:-2.9725},{x:-5.5637,z:2.3098},
  {x:10.9131,z:-2.3019},{x:-11.33,z:-3.33}
];
function packUsableBox(){
  const m=BODY_R+WALL_AISLE+PAD;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  return {minX:Math.min(...xs)+m,maxX:Math.max(...xs)-m,minZ:Math.min(...zs)+m,maxZ:Math.max(...zs)-m};
}
function packGapFill(rounds, solids, box, steps, half){
  for (const step of steps){
    const offs = half ? [0, step*0.5] : [0];
    for (const oz of offs) for (const ox of offs){
      for (let z=box.minZ+oz; z<=box.maxZ+1e-9; z+=step)
        for (let x=box.minX+ox; x<=box.maxX+1e-9; x+=step)
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
    }
  }
}
function packLightPolish(rounds, solids, lockedCount, iters){
  for (let iter=0; iter<iters; iter++){
    for (let i=lockedCount;i<rounds.length;i++){
      const fx=(0-rounds[i].x)*0.02, fz=(-1.2-rounds[i].z)*0.02;
      const trials=[{x:rounds[i].x+fx,z:rounds[i].z+fz},{x:rounds[i].x+fx,z:rounds[i].z},{x:rounds[i].x,z:rounds[i].z+fz}];
      for (const t of trials){
        if (packPointLegal(t.x,t.z,rounds,solids,i)){ rounds[i]=t; break; }
      }
    }
  }
}
function packHexSync(solids, locked, opts){
  const box=packUsableBox();
  const gapStep=(opts && opts.gapStep) || 0.4;
  // Soft floor only — never early-stop; Screen keep off frees the front strip for more tables
  const target=(opts && opts.target) != null ? opts.target : (screenKeepOn ? 14 : 20);
  let best=[];
  if (!locked.length){
    const rounds=[];
    for (const p of BEST_SEED) if (packPointLegal(p.x,p.z,rounds,solids)) rounds.push({x:p.x,z:p.z});
    packGapFill(rounds, solids, box, [0.28,0.16,0.1], true);
    packLightPolish(rounds, solids, 0, 12);
    packGapFill(rounds, solids, box, [0.1,0.07], false);
    // Extra fine fill when screen keep is off — that 2.8 m strip becomes usable
    if (!screenKeepOn) packGapFill(rounds, solids, box, [0.12,0.08,0.06], true);
    best=rounds.map(t=>({x:t.x,z:t.z}));
    // Do NOT return early at target — keep searching denser layouts below
  }
  const configs=[{pitch:2.92,div:8},{pitch:MIN_C2C,div:6}];
  let bestRounds=locked.map(t=>({x:t.x,z:t.z}));
  let bestCount=0;
  for (const cfg of configs){
    const pitch=cfg.pitch, div=cfg.div, rowP=pitch*Math.sqrt(3)/2;
    for (let oi=0; oi<div; oi++) for (let oj=0; oj<div; oj++){
      const ox=(oi/div)*pitch, oz=(oj/div)*rowP;
      const rounds=locked.map(t=>({x:t.x,z:t.z}));
      for (let r=-18;r<=18;r++){
        const rs=(r&1)?pitch/2:0;
        for (let c=-18;c<=18;c++){
          const x=ox+rs+c*pitch, z=oz+r*rowP;
          if (x<box.minX-0.2||x>box.maxX+0.2||z<box.minZ-0.2||z>box.maxZ+0.2) continue;
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
        }
      }
      for (let z=box.minZ; z<=box.maxZ+1e-9; z+=gapStep)
        for (let x=box.minX; x<=box.maxX+1e-9; x+=gapStep)
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
      const n=rounds.length-locked.length;
      if (n>bestCount){ bestCount=n; bestRounds=rounds; }
    }
  }
  const rounds=bestRounds.map(t=>({x:t.x,z:t.z}));
  packGapFill(rounds, solids, box, [0.22,0.12], true);
  packLightPolish(rounds, solids, locked.length, 8);
  packGapFill(rounds, solids, box, [0.08], false);
  const placed=rounds.slice(locked.length);
  if (placed.length>best.length) best=placed;
  return best;
}

function fillGapsHexOnce(){
  const solids=packSolidsFromItems();
  const locked=items.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const existing=items.filter(i=>i.kind==='move'&&i.type==='round'&&!isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const rounds=locked.concat(existing);
  const margin=BODY_R+WALL_AISLE+PAD;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const minX=Math.min(...xs)+margin, maxX=Math.max(...xs)-margin;
  const minZ=Math.min(...zs)+margin, maxZ=Math.max(...zs)-margin;
  const step=0.4;
  let n=0;
  for (let z=minZ; z<=maxZ+1e-9; z+=step){
    for (let x=minX; x<=maxX+1e-9; x+=step){
      if (!packPointLegal(x,z,rounds,solids)) continue;
      rounds.push({x,z});
      seq++; items.push({ id:'t'+seq, kind:'move', type:'round', x, z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
      n++;
    }
  }
  return n;
}

function addUntilFull(){
  return fillGapsHexOnce();
}

function runMaxPax(){
  const kept=items.filter(i=>i.kind==='permanent' || isLocked(i));
  items=kept.slice();
  const solids=packSolidsFromItems();
  const locked=kept.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const placed=packHexSync(solids, locked, { gapStep: screenKeepOn ? 0.4 : 0.28, target: screenKeepOn ? 14 : 22 });
  for (const p of placed){
    seq++;
    items.push({ id:'t'+seq, kind:'move', type:'round', x:p.x, z:p.z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
  }
  // Light check — drop any illegal (should be zero)
  pruneIllegalTables();
  const n=renumberTables();
  const guests=setGuestsFromTables();
  render();
  setStatus('Max PAX · '+n+' tables · '+guests+' guests');
  return n;
}

function nextStageAnchor(){
  const decks=items.filter(i=>i.type==='stage' && i.group==='stage');
  if (!decks.length) return { x:0, z:STAGE_Z };
  decks.sort((a,b)=>a.x-b.x);
  const right=decks[decks.length-1];
  return { x:right.x + deckPitch, z:right.z };
}
function stampKitAt(kind, x, z){
  const def=KIT_DEFS[kind];
  if (!def) return;
  seq++;
  let it;
  if (kind==='stage'){
    stageSeq++;
    it = makeStageDeck('stage'+stageSeq, x, z);
    it = fitPermanentIntoPerimeter(it);
    // snap to nearby decks on place
    snapStageDeck(it);
    recomputeStageGroups();
  } else {
    it = { id:kind+seq, kind:'permanent', type:def.type, x, z, w:def.w, d:def.d, label:def.label, locked:false };
    it = fitPermanentIntoPerimeter(it);
  }
  items.push(it);
  yieldOverlappingOnly(it);
  untangleTables();
  if (liveMax){ addUntilFull(); renumberTables(); }
  selectedId=it.id;
  clearPlaceKit();
  render();
  setStatus('Placed · '+kitLabel(it));
}

  if (!m) return null;
  return { stages: m[1] ? Number(m[1]) : 0, dance: !!m[2] };

/** Snapshot for a Banquet standard: stage/dance/AV + tables + guests + screen keep */
function snapshotStandardItems(){
  return items.map(i=>({
    id:i.id, kind:i.kind, type:i.type, x:i.x, z:i.z, w:i.w, d:i.d,
    label:i.label||'', locked:!!i.locked, group:i.group||null
  }));
}
function applyStandardSnapshot(std){
  items = (std.items||[]).map(i=>({...i}));
  stageSeq = items.filter(i=>i.type==='stage').length;
  seq = Math.max(seq, items.filter(i=>i.kind==='move'&&i.type==='round').length);
  if (typeof std.screenKeepOn === 'boolean') screenKeepOn = std.screenKeepOn;

  });

function refreshStyleSelects(){
  const standards = loadStandards();
  document.querySelectorAll('select.sync-style').forEach(sel=>{
    const cur = sel.value || brief.style;
    // Remove prior dynamic standard options
    [...sel.querySelectorAll('option[data-std]')].forEach(o=>o.remove());
    // Insert after last built-in banquet-* option (before cabaret)
    let cab = [...sel.options].find(o=>o.value==='cabaret');
    standards.forEach(std=>{
      const o=document.createElement('option');
      o.value = 'banquet-std:'+std.id;
      o.textContent = 'Banquet · '+std.name;
      o.dataset.std = '1';
      if (cab) sel.insertBefore(o, cab);
      else sel.appendChild(o);
    });
    // restore selection if still valid
    if ([...sel.options].some(o=>o.value===cur)) sel.value = cur;
    else if ([...sel.options].some(o=>o.value===brief.style)) sel.value = brief.style;
  });
}

function saveBanquetStandard(){
  const def = 'Standard configuration';
  const name = (window.prompt('Name this Banquet standard', def)||'').trim();
  if (!name){ setStatus('Standard not saved'); return; }
  const list = loadStandards();
  const id = 's'+Date.now().toString(36);
  const entry = {
    id, name,
    people: brief.people || '',
    screenKeepOn: !!screenKeepOn,
    items: snapshotStandardItems()
  };
  // Replace same name
  const next = list.filter(x=>x.name.toLowerCase()!==name.toLowerCase());
  next.push(entry);
  saveStandards(next);
  brief.style = 'banquet-std:'+id;
  refreshStyleSelects();
  applyBriefToDom();
  setStatus('Saved Banquet · '+name+' — now in Style dropdown');
}

        const main=document.createElement('div');
        main.className='type-row-main';
        while (el.firstChild && !(el.firstChild.classList && el.firstChild.classList.contains('field-type'))){
          // careful - only move non-chip
          const c=el.firstChild;
          if (c.classList && c.classList.contains('field-type')) break;
          main.appendChild(c);
        }
        el.insertBefore(main, el.firstChild);
      }
      ensureChip(el);
    });
  }
  function wireAll(){
    document.querySelectorAll('.rail-field[data-field]').forEach(ensureChip);
    // Add… / Place… rows
    document.querySelectorAll('.rail-pane > .add-wrap, .rail-pane .card > .add-wrap').forEach((el,i)=>{
      el.dataset.typekey = el.dataset.typekey || 'add';
      el.classList.add('type-row');
      ensureChip(el);
    });
    // Live max / Max PAX / Screen keep / Clear tools
    document.querySelectorAll('.rail-pane > .rail-tools').forEach(el=>{
      el.dataset.typekey = el.dataset.typekey || 'tools';
      el.classList.add('type-row');
      ensureChip(el);
    });
  }
  wireAll();
  window.__wireFieldTypeControls = wireAll;
  const _rb = window.__rebuildMyUi;
  if (typeof _rb === 'function'){
    window.__rebuildMyUi = function(){ _rb(); wireAll(); };
  }
})();

function applyBanquetBigStuff(styleVal){
  // Saved Banquet standard template
  if (String(styleVal||'').startsWith('banquet-std:')){
    const id = String(styleVal).slice('banquet-std:'.length);
    const std = loadStandards().find(x=>x.id===id);
    if (!std){ setStatus('Standard missing'); return; }
    applyStandardSnapshot(std);
    return;
  }
  const spec = parseBanquetStyle(styleVal);
  if (!spec){
    // cabaret/classroom/theatre — leave map; just record style
    return;
  }
  // Strip prior stage + dance only
  items = items.filter(i => i.type !== 'stage' && i.type !== 'dance');
  stageSeq = 0;
  if (spec.stages > 0){
    const n = spec.stages;
    const startX = -((n - 1) / 2) * deckPitch;
    for (let i=0;i<n;i++){
      stageSeq++;
      items.push(makeStageDeck('stage'+stageSeq, startX + i*deckPitch, STAGE_Z));
    }
  }
  if (spec.dance){
    items.push({
      id:'dance1', kind:'permanent', type:'dance',
      x:0, z:-2.2, w:DANCE_FLOOR.w, d:DANCE_FLOOR.d,
      label:'Dance', locked:false
    });
  }
  if (typeof recomputeStageGroups === 'function') recomputeStageGroups();
  const bits=[];
  if (spec.stages) bits.push(spec.stages+' stage');
  if (spec.dance) bits.push('dance');
  setStatus(bits.length ? ('Banquet · '+bits.join(' + ')) : 'Banquet · empty (add stage/dance in Style)');
  render();
}

/* Left-rail field reorder — all UIs; order kept per pane */
(function initRailFieldDrag(){
  const KEY = 'plan2d-rail-field-order';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function save(map){ localStorage.setItem(KEY, JSON.stringify(map)); }
  function fieldsIn(root){ return [...root.querySelectorAll(':scope > .rail-field')]; }
  function applyOrder(root, paneId, map){
    const order = map[paneId];
    if (!order || !order.length) return;
    const by = Object.fromEntries(fieldsIn(root).map(el => [el.dataset.field, el]));
    order.forEach(id => { if (by[id]) root.appendChild(by[id]); });
    // keep non-fields after: move tools/status back? appendChild fields only reorders among themselves if we insert before first non-field
  }
  function normalize(root){
    // Keep rail-fields as a contiguous block at their natural zone: before details/tools/staff
    const fields = fieldsIn(root);
    if (!fields.length) return;
    const anchor = [...root.children].find(el => !el.classList.contains('rail-field') && (
      el.classList.contains('rail-tools') || el.classList.contains('add-wrap') || el.classList.contains('staff') || el.tagName==='DETAILS' || el.classList.contains('count') || el.classList.contains('status-line') || el.classList.contains('sum')
    ));
    // For UI3 card: sum is first — leave sum, reorder fields, leave details at end
    fields.forEach(f => {
      if (anchor) root.insertBefore(f, anchor);
      else root.appendChild(f);
    });
  }
  function persist(root, paneId){
    const map = load();
    map[paneId] = fieldsIn(root).map(el => el.dataset.field);
    save(map);
  }
  document.querySelectorAll('.rail-pane').forEach(pane => {
    const paneId = pane.dataset.pane || 'x';
    const roots = pane.querySelector('.card') ? [pane.querySelector('.card')] : [pane];
    roots.forEach(root => {
      const map = load();
      // apply saved order
      const order = map[paneId];
      if (order && order.length){
        const by = Object.fromEntries(fieldsIn(root).map(el => [el.dataset.field, el]));
        const firstNon = [...root.children].find(el => !el.classList.contains('rail-field') && !el.classList.contains('sum'));
        order.forEach(id => {
          const el = by[id];
          if (!el) return;
          if (firstNon) root.insertBefore(el, firstNon);
          else root.appendChild(el);
        });
      }
      let dragEl = null;
      root.querySelectorAll(':scope > .rail-field').forEach(field => {
        field.addEventListener('dragstart', e => {
          if (e.target.closest('input,select,textarea,button')) { e.preventDefault(); return; }
          dragEl = field;
          field.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', field.dataset.field||''); } catch {}
        });
        field.addEventListener('dragend', () => {
          field.classList.remove('dragging');
          root.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
          dragEl = null;
          persist(root, paneId);
        });
        field.addEventListener('dragover', e => {
          e.preventDefault();
          if (!dragEl || dragEl===field) return;
          field.classList.add('drag-over');
          const rect = field.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height/2;
          if (before) root.insertBefore(dragEl, field);
          else root.insertBefore(dragEl, field.nextSibling);
        });
        field.addEventListener('dragleave', () => field.classList.remove('drag-over'));
        field.addEventListener('drop', e => { e.preventDefault(); field.classList.remove('drag-over'); });
      });
    });
  });
})();
