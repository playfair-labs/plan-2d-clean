<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Plan 2D Clean — QT Parramatta</title>
<meta name="plan2d-build" content="t659" />
<meta name="plan2d-sync" content="" />
<style>
  :root {
    --bg:#161513; --panel:#1c1b19; --ink:#eceae6; --muted:#8a8680;
    --line:#2c2a26; --soft:#242220; --accent:#c9a227; --mapbg:#121110;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; min-height:100dvh; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column;
  }
  .top {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:7px 12px; border-bottom:1px solid var(--line); background:var(--panel);
    flex-shrink:0;
  }
  .top strong { font-size:14px; letter-spacing:.05em; font-weight:700; }
  .ui-tog { display:flex; gap:2px; align-items:center; }
  .rail-mapdock .ui-tog button { height:28px; padding:0 8px; font-size:11px; }
  .ui-tog button {
    background:transparent; color:var(--muted); border:1px solid transparent;
    border-radius:6px; padding:6px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .ui-tog button:hover { color:var(--ink); background:var(--soft); }
  .ui-tog button.on { color:var(--ink); border-color:var(--line); background:var(--soft); }
  .shell { flex:1; display:flex; min-height:0; }
  .rail {
    /* proto type chips need width — OK for prototype */
    width:min(340px, 28vw); min-width:min(340px, 42vw); flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--line); padding:14px 14px 16px;
    display:flex; flex-direction:column; gap:12px; overflow:auto;
  }
  .rail-pane { display:none; flex-direction:column; gap:8px; flex:1; min-height:0; }
  .rail-pane.on { display:flex; }
  .door { display:flex; flex-direction:column; gap:3px; }
  .door label, .tiny-lab {
    font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); font-weight:650;
  }
  .door input, .door select, .act-row input, .act-row select {
    width:100%; background:var(--soft); color:var(--ink);
    border:1px solid var(--line); border-radius:8px;
    padding:12px 12px; font-size:18px;
  }
  .door input:focus, .door select:focus, .act-row input:focus, .act-row select:focus {
    outline:1px solid #4a463e;
  }
  .fixed {
    padding:12px; border:1px solid var(--line); border-radius:8px;
    background:#1a1917; color:var(--muted); font-size:18px;
  }
  .quiet-btn, .kit-list button, .sec button, .seg button, .step button {
    background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:10px 12px; font-size:15px; font-weight:600;
    cursor:pointer; text-align:left;
  }
  .quiet-btn:hover, .kit-list button:hover, .sec button:hover, .seg button:hover, .step button:hover {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .quiet-btn.on { color:var(--accent); border-color:#3f3820; background:#221e14; }
  .rail-tools { display:flex; flex-wrap:wrap; gap:3px; padding-top:4px; border-top:1px solid var(--line); }
  .add-wrap { position:relative; }
  .add-wrap > summary {
    list-style:none; cursor:pointer; font-size:15px; color:#b8b4ac;
    padding:10px 12px; border-radius:8px; border:1px solid transparent; user-select:none;
  }
  .add-wrap > summary::-webkit-details-marker { display:none; }
  .add-wrap > summary:hover, .add-wrap[open] > summary {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .kit-pop {
    position:absolute; left:0; right:0; top:100%; z-index:30;
    margin-top:4px; padding:4px; background:#1a1917;
    border:1px solid var(--line); border-radius:8px;
    display:flex; flex-direction:column; gap:1px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .kit-list { display:flex; flex-direction:column; gap:1px; }
  .kit-list.tiny button { font-size:15px; padding:8px 10px; color:#c4c0b8; }
  .kit-list button.armed, .kit-pop button.armed { color:var(--accent); }
  .kit-pop button { width:100%; background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:10px 12px; font-size:15px; cursor:pointer; text-align:left; }
  .kit-pop button:hover { background:var(--soft); color:var(--ink); }
  .act-row {
    display:flex; flex-direction:column; gap:4px; padding:7px 8px;
    border:1px solid var(--line); border-radius:8px; background:#191816;
  }
  .act-row .q { font-size:16px; font-weight:650; color:var(--ink); }
  .card {
    padding:14px; border:1px solid var(--line); border-radius:12px; background:#191816;
    display:flex; flex-direction:column; gap:12px;
  }
  .card .sum { font-size:18px; font-weight:650; line-height:1.3; }
  .card .sum span { color:var(--accent); }
  .step { display:flex; align-items:center; gap:8px; }
  .step button { font-size:16px; width:34px; height:34px; text-align:center; border:1px solid var(--line); background:var(--soft); }
  .step .n { font-size:28px; font-weight:700; min-width:2.2em; text-align:center; }
  .seg { display:flex; flex-wrap:wrap; gap:3px; }
  .seg button { border:1px solid var(--line); padding:5px 8px; }
  .seg button.on { color:var(--ink); background:var(--soft); border-color:#4a463e; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chips button {
    border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    background:transparent; color:#b8b4ac; font-size:15px; cursor:pointer;
  }
  .chips button.on { color:var(--ink); background:var(--soft); border-color:#4a463e; }
  .staff { margin-top:4px; padding-top:6px; border-top:1px solid var(--line); }
  .status-line { margin-top:auto; font-size:14px; color:var(--accent); min-height:1.2em; line-height:1.35; }
  .count { font-size:15px; color:var(--muted); font-weight:650; }
  .mapwrap { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--mapbg); }
  .sec { display:none; }
  .rail-mapdock {
    margin-top:auto; flex-shrink:0; padding-top:10px;
    border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px;
  }
  .rail-mapdock .map-acts {
    display:flex; flex-wrap:wrap; gap:3px;
  }
  .rail-mapdock .map-acts button {
    background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:8px; padding:8px 10px; font-size:13px; font-weight:600;
    cursor:pointer;
  }
  .rail-mapdock .map-acts button:hover {
    background:var(--soft); border-color:var(--line); color:var(--ink);
  }
  .rail-mapdock .map-acts .sep { width:1px; height:18px; background:var(--line); margin:0 2px; align-self:center; }
  .rail-mapdock .zoom-bar {
    display:flex; gap:6px; align-items:center; justify-content:flex-start;
    padding:0;
  }
  .rail-mapdock .ui-tog { flex-wrap:wrap; }
  .rail-mapdock .ui-tog button { height:28px; padding:0 8px; font-size:11px; }
  .stage {
    flex:1; min-height:0; display:flex; align-items:stretch; justify-content:stretch;
    padding:0; overflow:hidden;
  }
  svg#plan {
    background:#e8e2d8; border-radius:0; touch-action:none;
    width:100%; height:100%; display:block;
  }
  .zoom-bar button { width:36px; height:32px; border-radius:8px; border:1px solid #3a3834; background:#242220; color:var(--ink); font-weight:800; font-size:16px; line-height:1; cursor:pointer; }
  .zoom-bar span { color:var(--muted); font-size:11px; min-width:3.5em; text-align:center; }

  .rail-field { cursor: grab; position: relative; touch-action: none; }
  .rail-field.dragging { opacity: 0.55; cursor: grabbing; }
  .rail-field.drag-over { outline: 1px dashed #8a8680; outline-offset: 2px; border-radius: 8px; }
  .rail-field::before { content: "⋮⋮"; position: absolute; left: -2px; top: 50%; transform: translateY(-50%); font-size: 9px; color: #6a6660; letter-spacing: -2px; opacity: 0.55; pointer-events: none; }

  .myui-hint { color:var(--muted); font-size:12px; line-height:1.35; padding:6px 2px 10px; }
  .myui-hint strong { color:var(--ink); font-weight:700; }
  .ctx-menu {
    position:fixed; z-index:50; min-width:180px; padding:4px;
    background:#2a2825; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .ctx-menu button {
    display:block; width:100%; text-align:left; border:0; background:transparent;
    color:var(--ink); font:inherit; font-size:13px; font-weight:600;
    padding:8px 10px; border-radius:8px; cursor:pointer;
  }
  .ctx-menu button:hover { background:var(--soft); }
  .ctx-menu .sec-lab { padding:8px 10px 2px; color:#8a8680; font-size:10px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
  .ctx-menu .sec-lab:first-child { padding-top:4px; }
  .chair-hit { cursor:pointer; }
  .chair-hit:hover { stroke:#c9a227; stroke-width:1.4; }
  .chair-hit.chair-sel { stroke:#c9a227; stroke-width:2.2; }

  .delete-big {
    display:block; width:100%; box-sizing:border-box;
    background:#c62828; color:#fff8f6; border:1px solid #8e1d1d;
    border-radius:10px; padding:14px 12px;
    font-size:22px; font-weight:800; letter-spacing:0.06em;
    text-transform:uppercase; cursor:pointer;
  }
  .delete-big:hover { background:#e03a3a; }
  .delete-big:disabled { opacity:0.38; cursor:default; background:#7a3030; }

  /* Prototype: type chips ON each left-rail row (Al: knobs on the thing) */
  .rail { width: min(400px, 48vw) !important; min-width: 320px !important; }
  .door.rail-field, .act-row.rail-field, .rail-field[data-field], .type-row {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) auto !important;
    flex-direction: unset !important;
    align-items: center !important;
    column-gap: 8px !important;
    row-gap: 3px !important;
  }
  .door.rail-field > label, .door.rail-field > input, .door.rail-field > select, .door.rail-field > .fixed,
  .act-row.rail-field > .q, .act-row.rail-field > input, .act-row.rail-field > select, .act-row.rail-field > .fixed,
  .rail-field > label, .rail-field > .q, .rail-field > .tiny-lab, .rail-field > input, .rail-field > select,
  .rail-field > .fixed, .rail-field > .step, .rail-field > div:not(.field-type),
  .type-row > .type-row-main, .type-row > summary, .type-row > .quiet-btn {
    grid-column: 1 !important;
    min-width: 0;
  }
  .field-type {
    grid-column: 2 !important;
    grid-row: 1 / span 12 !important;
    align-self: center !important;
    display: flex !important;
    flex-direction: row !important;
    gap: 3px !important;
    z-index: 6;
  }
  .field-type button {
    height: 26px !important; min-width: 28px !important; padding: 0 6px !important;
    border-radius: 7px !important; border: 1px solid #5a5650 !important;
    background: #2e2c28 !important; color: #f0ebe3 !important;
    font-size: 11px !important; font-weight: 800 !important; cursor: pointer !important;
  }
  .field-type button.on { border-color: #c9a227 !important; color: #c9a227 !important; }
  .field-type .px {
    min-width: 2.1em; text-align: center; font-size: 12px !important; font-weight: 800 !important;
    color: var(--accent) !important; line-height: 26px; padding: 0 2px; user-select: none;
  }

  .build-big {
    margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px dashed #5a5650; background: #1a1917;
    font-size: 42px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--accent); text-align: center; line-height: 1.2;
  }
  .build-big small { display:block; font-size:11px; font-weight:650; color:var(--muted); letter-spacing:0.06em; text-transform:uppercase; margin-bottom:2px; }

  .owner-tag {
    font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); padding: 2px 2px 6px;
  }

  .guests-max {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
  }
  .guests-max .gm-half { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .guests-max .gm-max .fixed {
    color: var(--accent); font-weight: 800; text-align: center;
  }
  .guests-max.over .gm-max .fixed {
    color: #e07070; border-color: #6a3030; background: #2a1818;
  }
  .guests-warn {
    grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: #e07070;
    line-height: 1.3; min-height: 0;
  }

  /* t648 — tight left rail (no empty stretch to bottom of 27") */
  .rail {
    padding: 10px 10px 12px !important;
    gap: 6px !important;
    width: min(360px, 42vw) !important;
    min-width: 300px !important;
  }
  .rail-pane {
    flex: 0 0 auto !important;
    gap: 5px !important;
    min-height: 0 !important;
  }
  .rail-pane.on { display: flex !important; }
  .door { gap: 2px !important; }
  .door label, .tiny-lab {
    font-size: 11px !important;
    letter-spacing: 0.03em !important;
  }
  .door input, .door select, .act-row input, .act-row select, .fixed {
    padding: 7px 9px !important;
    font-size: 14px !important;
    border-radius: 7px !important;
  }
  .quiet-btn, .add-wrap > summary {
    padding: 6px 8px !important;
    font-size: 13px !important;
  }
  .rail-tools { gap: 2px !important; padding-top: 2px !important; }
  .status-line {
    margin-top: 2px !important;
    font-size: 12px !important;
    min-height: 0 !important;
  }
  .count { font-size: 12px !important; }
  .rail-mapdock {
    margin-top: 8px !important; /* sit under fields — not screen bottom */
    padding-top: 8px !important;
    gap: 5px !important;
  }
  .rail-mapdock .map-acts button {
    padding: 5px 7px !important;
    font-size: 12px !important;
  }
  .rail-mapdock .delete-big {
    padding: 12px 10px !important;
    font-size: 20px !important;
  }
  .build-big {
    margin-top: 0 !important;
    padding: 4px 8px !important;
    font-size: 20px !important;
    border-radius: 8px !important;
  }
  .build-big small { font-size: 9px !important; margin-bottom: 0 !important; }
  .owner-tag { font-size: 11px !important; padding: 0 0 2px !important; }
  .field-type button {
    height: 22px !important; min-width: 24px !important; padding: 0 4px !important;
    font-size: 10px !important;
  }
  .field-type .px { font-size: 11px !important; line-height: 22px !important; }
  .guests-max { gap: 6px !important; }
  .act-row { padding: 5px 6px !important; gap: 2px !important; }
  .act-row .q { font-size: 13px !important; }
  .card { padding: 10px !important; gap: 8px !important; }
  .ui-tog button { height: 24px !important; padding: 0 6px !important; font-size: 10px !important; }
  .zoom-bar button { width: 30px !important; height: 28px !important; font-size: 14px !important; }


  .num-mode { display:flex; flex-wrap:wrap; gap:3px; align-items:center; }
  .num-mode span { font-size:10px; font-weight:700; color:var(--muted); letter-spacing:0.04em; text-transform:uppercase; margin-right:4px; }
  .num-mode button {
    background:transparent; color:#b8b4ac; border:1px solid transparent;
    border-radius:7px; padding:4px 8px; font-size:11px; font-weight:700; cursor:pointer;
  }
  .num-mode button:hover { background:var(--soft); border-color:var(--line); color:var(--ink); }
  .num-mode button.on { color:var(--accent); border-color:#3f3820; background:#221e14; }

  .date-room {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%;
  }
  .date-room .dr-half { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .pdf-stack {
    display:flex; flex-direction:column; gap:8px;
    padding: 2px 0 8px;
  }
  .pdf-stack button {
    display:block; width:100%; box-sizing:border-box;
    background:#242220; color:#eceae6; border:1px solid #3a3834;
    border-radius:10px; padding:14px 12px;
    font-size:16px; font-weight:800; letter-spacing:0.02em;
    cursor:pointer; text-align:left;
  }
  .pdf-stack button:hover { background:#2c2a26; border-color:#5a5650; }
  .pdf-stack .pdf-lab {
    font-size:10px; font-weight:800; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted); padding:2px 2px 0;
  }
  .throw-row { display:flex; gap:6px; }
  .throw-row button { flex:1; padding:10px 8px; font-size:13px; }

  .pdf-preview, .phone-app {
    position:fixed; inset:0; z-index:80; background:#1a1612;
    display:none; flex-direction:column;
  }
  .pdf-preview.on, .phone-app.on { display:flex; }
  .pdf-preview .bar, .phone-app .bar {
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; background:#11100e; border-bottom:1px solid #2c2a26;
  }
  .pdf-preview .bar button, .phone-app .bar button {
    background:#2a2825; color:#eceae6; border:1px solid #3a3834;
    border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer;
  }
  .pdf-preview .sheet {
    flex:1; overflow:auto; background:#5a564e; padding:18px;
    display:flex; justify-content:center;
  }
  .pdf-sheet {
    width:min(1100px, 96vw); background:#f7f3ea; color:#1a1612;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .pdf-head {
    display:grid; grid-template-columns: 140px 1fr 140px;
    align-items:center; gap:12px; padding:14px 18px 10px;
    border-bottom:1px solid #d8d0c2; min-height:88px;
  }
  .pdf-head img { max-height:52px; max-width:132px; width:auto; object-fit:contain; }
  .pdf-head .qt { justify-self:end; }
  .pdf-head .meta { text-align:left; }
  .pdf-head .meta .top { font-weight:700; font-size:22px; line-height:1.15; }
  .pdf-head .meta .bot { font-size:15px; color:#6a6458; margin-top:4px; }
  .pdf-sheet .plan-slot { padding:8px; }
  .pdf-sheet .plan-slot svg { width:100%; height:auto; background:#e8e2d8; display:block; }

  .phone-app { background:#f7f3ea; color:#1a1612; }
  .phone-app .bar { background:#f7f3ea; border-bottom:1px solid #d8d0c2; }
  .phone-app .bar button { background:#1a1612; color:#f7f3ea; }
  .phone-home, .phone-room {
    flex:1; overflow:auto; padding:20px 18px 28px;
    display:flex; flex-direction:column; align-items:center;
  }
  .phone-home h2 {
    font-size:1.7rem; margin:8px 0 18px; font-weight:700; text-align:center;
  }
  .phone-home .evt { color:#6a6458; font-size:1rem; margin-top:-8px; margin-bottom:18px; text-align:center; }
  .phone-home button.room-card {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:min(22rem, 100%); min-height:5.5rem; margin:0 0 12px;
    border:0; border-radius:1.75rem; background:#1a1612; color:#f7f3ea;
    font:inherit; cursor:pointer; padding:16px;
  }
  .phone-home button.room-card strong { font-size:1.7rem; line-height:1; }
  .phone-home button.room-card span { margin-top:8px; opacity:.9; }
  .phone-room .pinch {
    width:100%; max-width:40rem; height:min(70dvh, 640px);
    overflow:auto; background:#e8e2d8; border-radius:16px;
    touch-action:pinch-zoom; border:1px solid #d8d0c2;
  }
  .phone-room .pinch svg { width:140%; height:auto; display:block; }
  .chair-icon { fill:#111; stroke:#111; }
</style>
</head>
<body>
<div class="top"><strong>QT PARRAMATTA · PLAN 2D</strong>
</div>
<div class="shell">
  <aside class="rail" aria-label="Essentials">
    <!-- UI1 Brief fields -->
    <div class="rail-pane on" data-pane="1">
      <div class="door rail-field" draggable="true" data-field="client"><label>Client</label><input class="sync-client" type="text" placeholder="Name" autocomplete="off" /></div>
      <div class="door rail-field" draggable="true" data-field="style"><label>Style</label>
        <select class="sync-style">
          <option value="banquet" selected>Banquet</option>
          <option value="banquet-s1">Banquet · 1 stage</option>
          <option value="banquet-s2">Banquet · 2 stage</option>
          <option value="banquet-s3">Banquet · 3 stage</option>
          <option value="banquet-s1-dance">Banquet · 1 stage + dance</option>
          <option value="banquet-s2-dance">Banquet · 2 stage + dance</option>
          <option value="banquet-s3-dance">Banquet · 3 stage + dance</option>
          <option value="cabaret">Cabaret</option>
          <option value="classroom">Classroom</option>
          <option value="theatre">Theatre</option>
        </select>
      </div>
      <div class="door rail-field" draggable="true" data-field="people">
        <div class="guests-max">
          <div class="gm-half"><label>Guests</label><input class="sync-people" type="number" min="1" step="1" placeholder="—" /></div>
          <div class="gm-half gm-max"><label>Max</label><div class="fixed sync-max">—</div></div>
          <div class="guests-warn sync-guest-warn" hidden></div>
        </div>
      </div>

  return (it && Array.isArray(it.removedSeats)) ? it.removedSeats : [];
}
function effectiveSeats(it){
  if (!it) return 0;
  if (it.type==='chair') return 1;
  if (it.type==='round') return Math.max(0, seatsOnRound(it) - removedSeatsOf(it).length);
  if (it.type==='trestle') {
    const kids = items.filter(c=>c.type==='chair' && c.parent===it.id).length;
    return kids || it.seats || 0;
  }
  return 0;
}

  const chairs = items.filter(i=>i.type==='chair').length;
  if (chairs) return chairs + items.filter(i=>i.type==='round').reduce((s,i)=>s+effectiveSeats(i), 0);
  return items.filter(i=>i.type==='round').reduce((s,i)=>s+effectiveSeats(i), 0);

const brief = { client:'', date:'', people:'', style:'banquet' };

function tablesNeeded(){
  const p = parseInt(brief.people, 10);
  if (!Number.isFinite(p) || p < 1) return 0;
  return Math.ceil(p / SEATS_PER_TABLE);
}
let _floorMaxCache = { cfg:'', algoTables:0, tables:0, guests:0 };
let _floorMaxTimer = null;
function floorConfigKey(){
  const bits = items.filter(i=>i.kind==='permanent' || isLocked(i)).map(i =>
    [i.type, i.x.toFixed(2), i.z.toFixed(2), (i.w||0).toFixed(2), (i.d||0).toFixed(2), i.locked?1:0, i.group||''].join(':')
  );

function isBanquetPackStyle(val){

function updateCounts(){
  const n = items.filter(i=>i.kind==='move'&&i.type==='round').length;
  const nTrestle = items.filter(i=>i.type==='trestle').length;
  const nChairs = items.filter(i=>i.type==='chair').length;
  const need = tablesNeeded();
  const p = parseInt(brief.people, 10);
  const floor = floorMaxSnapshot();
  const maxG = floor.guests;
  let text = '';
  if (!isBanquetPackStyle()){
    const covers = roomSeats() || (Number.isFinite(p)?p:0);
    const bits = [];
    if (covers) bits.push(covers+' covers');
    if (n) bits.push(n+' rounds');
    if (nTrestle) bits.push(nTrestle+' trestles');
    if (nChairs) bits.push(nChairs+' chairs');
    if (maxG) bits.push('max '+maxG);
    text = bits.join(' · ');
  } else if (Number.isFinite(p) && p > 0) {
    text = 'Guests '+p+' · '+n+' tables';
    if (need && n !== need) text += ' · need '+need;
    if (maxG && p > maxG) text += ' · over max '+maxG;
  } else if (n) {
    text = n + ' tables · Max PAX sets guests';

  document.querySelectorAll('.tableCount').forEach(el=>{ el.textContent = text; });
  document.querySelectorAll('.sync-max').forEach(el=>{ el.textContent = maxG ? String(maxG) : '—'; });
  const over = Number.isFinite(p) && p > 0 && maxG > 0 && p > maxG;
  const warn = over
    ? ("Can't fit "+p+" · max "+maxG+" ("+floor.tables+" tables) in this layout")
    : '';
  document.querySelectorAll('.sync-guest-warn').forEach(el=>{
    if (warn){ el.hidden = false; el.textContent = warn; }
    else { el.hidden = true; el.textContent = ''; }

}
/** Match unlocked banquet tables to ceil(people/10). Adds when guests rise; trims unlocked extras when guests fall. Locks + permanents untouched. */
function syncTablesToPeople(){
  invalidateFloorMax();
  if (!isBanquetPackStyle()){ updateCounts(); return; }
  // Guests acts like Max PAX: dense-pack up to ceil(guests/10)
  const need = tablesNeeded();
  const p = parseInt(brief.people, 10);
  if (!need){ updateCounts(); return; }
  // Chair-delete drops people by 1 but must not rebuild / yank the parent table.
  const have = items.filter(i=>i.type==='round').length;
  if (have === need && roomSeats() === p){
    updateCounts();
    return;
  }
  const kept = items.filter(i=>i.kind==='permanent' || isLocked(i));
  items = kept.slice();
  const solids = packSolidsFromItems();
  const lockedPts = kept.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  // Aim high, then keep only `need` densest-first results
  let placed = packHexSync(solids, lockedPts, {
    gapStep: screenKeepOn ? 0.32 : 0.16,
    target: Math.max(need + 10, 30)
  });
  if (placed.length > need) placed = placed.slice(0, need);
  for (const pt of placed){
    seq++;
    items.push({ id:'t'+seq, kind:'move', type:'round', x:pt.x, z:pt.z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
  }
  pruneIllegalTables();
  const n = renumberTables();
  render();
  recomputeFloorMaxAlgo();
  const floor = floorMaxSnapshot();
  if (n < need){
    setStatus(p+' guests need '+need+' tables · only '+n+' fit · max '+floor.guests);
  } else if (floor.guests && p > floor.guests){
    setStatus('Over max · '+p+' guests asked · floor max '+floor.guests);
  } else {
    setStatus(p+' guests · '+n+' tables packed');
  }
}

function pushOutSelf(it, opts={}){

        const cx=s.x+s.w/2, cz=s.z+s.d/2;

        const nz=Math.max(s.z, Math.min(cur.z, s.z+s.d));

        if (opts.ignoreMove && o.kind==='move' && !isLocked(o)) continue;
        let dx=cur.x-o.x, dz=cur.z-o.z;

        if (dist < 1e-4){ dx=1; dz=0; dist=1; }

      for (const s of solidsFor(cur, opts)) {

function tidyLayout(mode, quiet){

  if (!movables.length){ if(!quiet) setStatus('Nothing to tidy'); return; }
  const kept = items.filter(i=>i.kind==='permanent' || isLocked(i));
  const n = movables.length;

      for (let c=0;c<rowCols;c++) out.push({ x:x0+rowShift+c*c2c, z:z0-r*c2c });
    }
    return out;
  }
  let C=cols, R=rows;
  for (let grow=0; grow<20; grow++){
    slots.length=0;
    slots.push(...buildSlots(C,R));
    if (slots.length >= n) break;
    if (C * c2c <= usableW + c2c) C++; else R++;
  }
  movables.sort((a,b)=>String(a.label).localeCompare(String(b.label), undefined, {numeric:true}));
  const used=new Set();
  const placed=[];
  function allLegalList(list){
    items = kept.concat(list);
    return list.every(t => isLegal(t));
  }
  for (const m of movables){
    let cand=null;
    for (let i=0;i<slots.length;i++){
      if (used.has(i)) continue;
      const tryP={...m, x:slots[i].x, z:slots[i].z};
      items=kept.concat(placed);
      if (isLegal(tryP)){ cand=tryP; used.add(i); break; }
    }
    if (!cand){
      items=kept.concat(placed);
      const slot=findFreeSlot(TABLE_D, TABLE_D, m.id);
      if (slot){
        const tryP={...m, x:slot.x, z:slot.z};
        if (isLegal(tryP)) cand=tryP;
      }
    }
    if (!cand){
      items=kept.concat(placed);
      const orig={...m};
      if (isLegal(orig)) cand=orig;
    }
    if (!cand){
      // Impossible without overlap — restore and stop
      items = snapshot;
      if (!quiet){ render(); setStatus('Tidy aborted · would stack — left as-was'); }
      return;
    }
    placed.push(cand);
  }
  if (placed.length !== n || !allLegalList(placed)){
    items = snapshot;
    if (!quiet){ render(); setStatus('Tidy aborted · overlap check failed'); }
    return;
  }
  items = kept.concat(placed);
  renumberTables();
  // Final pairwise proof
  const rounds = items.filter(i=>i.kind==='move'&&i.type==='round');
  for (let i=0;i<rounds.length;i++){
    for (let j=i+1;j<rounds.length;j++){
      const dx=rounds[i].x-rounds[j].x, dz=rounds[i].z-rounds[j].z;
      if (dx*dx+dz*dz < MIN_C2C*MIN_C2C - 1e-9){
        items = snapshot;
        if (!quiet){ render(); setStatus('Tidy aborted · C2C fail'); }
        return;
      }
    }
  }
  if (!quiet){ render(); setStatus('Tidied · '+mode+' · '+placed.length+' tables · no overlap'); }
}
function shuffleMovables(quiet){
  const movables=packableMove().map(m=>({...m}));
  const kept=items.filter(i=>i.kind==='permanent' || isLocked(i));
  const placed=[];
  for (const m of movables){
    items=kept.concat(placed);
    let best=null;
    for (let r=0;r<=2;r++){
      for (let a=0;a<8;a++){
        const ang=a*Math.PI/4, rad=r*0.4;
        const cand={...m, x:m.x+Math.cos(ang)*rad, z:m.z+Math.sin(ang)*rad};
        if (isLegal(cand)){ best=cand; break; }
      }
      if (best) break;
    }
    if (!best){
      const pushed=pushOutSelf(m);
      if (pushed) best=pushed;
    }
    if (!best){ const slot=findFreeSlot(m.w,m.d,m.id); if(slot) best={...m,...slot}; }
    if (best) placed.push(best);
  }
  items=kept.concat(placed);
  renumberTables();
  if (!quiet){ render(); setStatus('Shuffled'); }
}

function decksFlush(a,b,slop){
  slop = slop==null ? 0.1 : slop;
  const aw=a.w/2, ad=a.d/2, bw=b.w/2, bd=b.d/2;
  const dx=Math.abs(a.x-b.x), dz=Math.abs(a.z-b.z);
  const touchX = Math.abs(dx-(aw+bw))<=slop && dz<=Math.max(ad,bd)*0.4;
  const touchZ = Math.abs(dz-(ad+bd))<=slop && dx<=Math.max(aw,bw)*0.4;
  return touchX || touchZ;
}
function recomputeAttachGroups(type, prefix){
  const decks=items.filter(i=>i.type===type);
  const parent={};
  decks.forEach(d=>parent[d.id]=d.id);
  function find(id){ return parent[id]===id ? id : (parent[id]=find(parent[id])); }
  function join(a,b){ a=find(a); b=find(b); if(a!==b) parent[b]=a; }
  for (let i=0;i<decks.length;i++){
    for (let j=i+1;j<decks.length;j++){
      if (decksFlush(decks[i], decks[j])) join(decks[i].id, decks[j].id);
    }
  }
  const map={}; let n=0;
  for (const d of decks){
    const root=find(d.id);
    if (!map[root]){ n++; map[root]=prefix+n; }
    d.group = map[root];
  }
}
function recomputeStageGroups(){ recomputeAttachGroups('stage', 'stage-g'); }
function recomputeDanceGroups(){ recomputeAttachGroups('dance', 'dance-g'); }
function snapAttachDeck(it){
  const SNAP=0.32;
  const others=items.filter(o=>o.type===it.type && o.id!==it.id);
  let best=null, bestDist=SNAP;
  for (const o of others){
    const cands=[
      {x:o.x+(o.w+it.w)/2, z:o.z},
      {x:o.x-(o.w+it.w)/2, z:o.z},
      {x:o.x, z:o.z+(o.d+it.d)/2},
      {x:o.x, z:o.z-(o.d+it.d)/2},
    ];
    for (const c of cands){
      const dist=Math.hypot(c.x-it.x, c.z-it.z);
      if (dist<bestDist){
        const trial={...it, x:c.x, z:c.z};
        if (isLegal(trial,{ignoreMove:true})){ bestDist=dist; best=c; }
      }
    }
  }
  if (!best) return false;
  it.x=best.x; it.z=best.z;
  return true;
}
function snapStageDeck(it){
  if (it.type!=='stage') return false;
  return snapAttachDeck(it);
}
function snapDanceTile(it){
  if (it.type!=='dance') return false;

function stageUnderLectern(lec){
  return items.find(st => st.type==='stage'
    && Math.abs(lec.x - st.x) <= st.w/2 + 0.05
    && Math.abs(lec.z - st.z) <= st.d/2 + 0.05) || null;
}
function groupMembers(it){
  if (it.type==='stage'){
    const stages = !it.group ? [it] : items.filter(o=>o.type==='stage' && o.group===it.group);
    const g = it.group;
    const lects = items.filter(o=>{
      if (o.type!=='lectern' || !o.locked) return false;
      if (g && o.group===g) return true;
      if (!g && stageUnderLectern(o) && stageUnderLectern(o).id===it.id) return true;
      return false;
    });
    return stages.concat(lects);
  }
  if (it.type==='dance'){
    return !it.group ? [it] : items.filter(o=>o.type==='dance' && o.group===it.group);
  }
  if (!it.group) return [it];
  return items.filter(o=>o.group===it.group);
}
function toggleLock(it){
  // Stages/tables: lock in place. Lectern uses Lock/Unlock menu (ties to stage).
  if (it.type==='lectern'){
    if (it.locked) unlockLectern(it);
    else lockLectern(it);
    return;
  }
  const members=groupMembers(it).filter(m=>m.type!=='lectern');
  const next=!it.locked;
  members.forEach(m=>{ m.locked=next; });
  setStatus(next ? 'Locked · pack designs around' : 'Unlocked');
  render();

function lockLectern(it){
  const st = stageUnderLectern(it);
  it.locked = true;
  if (st){
    if (!st.group){
      const gid = 'sg'+Date.now().toString(36);
      // join flush decks into one group
      const mates = items.filter(o=>o.type==='stage' && (
        o.id===st.id || (o.group && o.group===st.group)
      ));
      // Prefer existing group on neighbouring joined decks
      recomputeStageGroups();
      const st2 = items.find(x=>x.id===st.id) || st;
      if (!st2.group){
        st2.group = gid;
        // pull flush neighbours already grouped by recompute — call again after assign
        items.filter(o=>o.type==='stage' && decksFlush(o, st2)).forEach(o=>{ o.group = gid; });
        recomputeStageGroups();
      }
      const st3 = items.find(x=>x.id===st.id) || st2;
      it.group = st3.group || gid;
      if (!st3.group) st3.group = it.group;
    } else {
      it.group = st.group;
    }
    setStatus('Lectern locked to stage');
  } else {
    it.group = null;
    setStatus('Lectern locked in place · place on stage to ride with it');
  }
  render();
}
function unlockLectern(it){
  it.locked = false;
  it.group = null;
  setStatus('Lectern unlocked');
  render();
}

  // Right-click Delete removed (t657). Lectern lock/unlock only.
  if (!it || it.type!=='lectern' || seat!=null) return;
  const menu = document.createElement('div');
  menu.className = 'ctx-menu';
  menu.style.left = clientX+'px';
  menu.style.top = clientY+'px';
  const lab = document.createElement('div');
  lab.className = 'sec-lab';
  lab.textContent = 'Lectern';
  menu.appendChild(lab);
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = it.locked ? 'Unlock lectern' : 'Lock lectern';
  b.onclick = ()=>{
    hideItemCtxMenu();
    if (it.locked) unlockLectern(it);
    else lockLectern(it);
  };
  menu.appendChild(b);
  document.body.appendChild(menu);
  itemCtxMenu = menu;
}
function onItemContextMenu(evt){
  const id = evt.currentTarget && evt.currentTarget.dataset && evt.currentTarget.dataset.id;
  const it = id && items.find(x=>x.id===id);
  evt.preventDefault();
  evt.stopPropagation();
  if (!it) return;
  const seatRaw = evt.currentTarget.dataset.seat;
  const seat = seatRaw!=null && seatRaw!=='' ? Number(seatRaw) : null;
  if (it.type!=='lectern' || Number.isFinite(seat)) return;
  selectedId = it.id;
  selectedSeat = null;
  render();
  showItemContextMenu(evt.clientX, evt.clientY, it, null);
}
function onDown(evt){

  if (placeKit){
    const hid=evt.currentTarget.dataset.id;
    const surface=items.find(x=>x.id===hid);
    if (canPlaceKitOnSurface(placeKit, surface)){
      evt.preventDefault(); evt.stopPropagation();
      const p=fromSvg(svgPoint(evt).x, svgPoint(evt).y);
      stampKitAt(placeKit, p.x, p.z);
    }
    return;
  }
  if (evt.button===2) return; // right-click: lectern lock only (no Delete)
  evt.preventDefault(); evt.stopPropagation();
  const id=evt.currentTarget.dataset.id;
  const it=items.find(x=>x.id===id); if(!it) return;
  // Nested select: click table once; click again on a chair to select that chair
  const seatRaw=evt.currentTarget.dataset.seat;
  const clickedSeat=seatRaw!=null && seatRaw!=='' ? Number(seatRaw) : null;
  const fromChair = it.type==='round' && Number.isFinite(clickedSeat);
  if (fromChair){
    if (selectedId===id) selectedSeat=clickedSeat;
    else { selectedId=id; selectedSeat=null; }
  } else {
    selectedId=id;
    selectedSeat=null;
  }
  // Chair clicks are select-only (no drag) so nested select cannot be confused with a grab
  if (fromChair){
    render();
    if (selectedSeat!=null) setStatus('Chair selected · left Delete removes this chair');
    else setStatus('Table '+(it.label||'')+' selected · click a chair to pick it');
    return;
  }
  const p=fromSvg(svgPoint(evt).x, svgPoint(evt).y);
  const members=groupMembers(it);
  // long-press lock (touch / trackpad)
  clearTimeout(longPressTimer);
  const startX=evt.clientX, startY=evt.clientY;
  longPressTimer=setTimeout(()=>{
    if (!drag) return;
    const moved=Math.hypot((drag._cx||startX)-startX, (drag._cy||startY)-startY);
    if (moved<6){ toggleLock(it); drag=null; }
  }, 550);
  drag={
    id, group: it.group||null,
    ox:p.x-it.x, oz:p.z-it.z,
    origins: members.map(m=>({id:m.id,x:m.x,z:m.z})),
    lastLegal: members.map(m=>({id:m.id,x:m.x,z:m.z})),
    _cx:startX, _cy:startY, _sx:startX, _sy:startY,
  };
  // Do not rebuild SVG here — replacing the hit releases pointer capture and kills the drag.
  try { evt.currentTarget.setPointerCapture(evt.pointerId); } catch (err) {}
  syncDeleteButton();
}
function deleteSeat(it, seat){
  if (!it || it.type!=='round') return;
  const idx = Number(seat);
  if (!Number.isFinite(idx) || idx<0 || idx>=seatsOnRound(it)) return;
  const cur = removedSeatsOf(it).slice();
  if (cur.indexOf(idx)>=0) return;
  cur.push(idx);
  it.removedSeats = cur;
  brief.people = String(roomSeats());
  applyBriefToDom();
  render();
  setStatus('Chair deleted · '+brief.people+' guests · table stays');
}
function deleteSelected(){
  invalidateFloorMax();
  if (!selectedId) return;
  const it=items.find(x=>x.id===selectedId);
  // Left Delete only — chair if nested, else the item (stage deck / dance tile / table / kit)
  if (it && it.type==='round' && selectedSeat!=null){
    deleteSeat(it, selectedSeat);
    selectedSeat=null;
    return;
  }
  items=items.filter(x=>x.id!==selectedId && x.parent!==selectedId);
  const typ=it && it.type;
  selectedId=null; selectedSeat=null; drag=null;
  if (typ==='stage') recomputeStageGroups();
  if (typ==='dance') recomputeDanceGroups();
  render();
  setStatus(typ==='stage' ? 'Stage deck deleted' : (typ==='dance' ? 'Dance tile deleted' : 'Deleted'));
}
function liveMaxPulse(perms){
  // During drag: only clear overlaps — never refill (no bounce / freeze)
  if (!liveMax) return;
  yieldForPermanents(perms);
  pruneIllegalTables();
}
function groupPoseLegal(members, opts){
  for (const m of members){ if (!isLegal(m, opts)) return false; }
  return true;
}
function applyGroupDelta(members, origins, dx, dz){
  for (const m of members){
    const o=origins.find(x=>x.id===m.id);
    if (o){ m.x=o.x+dx; m.z=o.z+dz; }
  }
}
/** Slide a composite as far as the pointer allows without going illegal (no rubber-band). */
function slideGroupToward(members, origins, dx, dz, opts){
  applyGroupDelta(members, origins, dx, dz);
  if (groupPoseLegal(members, opts)) return true;
  let lo=0, hi=1;
  for (let i=0;i<10;i++){
    const mid=(lo+hi)/2;
    applyGroupDelta(members, origins, dx*mid, dz*mid);
    if (groupPoseLegal(members, opts)) lo=mid; else hi=mid;
  }
  applyGroupDelta(members, origins, dx*lo, dz*lo);
  return lo > 1e-4;
}
function onMove(evt){
  if (!drag) return;
  drag._cx=evt.clientX; drag._cy=evt.clientY;
  if (Math.hypot(evt.clientX-drag._sx, evt.clientY-drag._sy)>6) clearTimeout(longPressTimer);
  const lead=items.find(x=>x.id===drag.id); if(!lead) return;
  if (isLocked(lead)){ setStatus('Locked · unlock to move'); return; }
  const p=fromSvg(svgPoint(evt).x, svgPoint(evt).y);
  const nx=p.x-drag.ox, nz=p.z-drag.oz;
  const members=groupMembers(lead);
  if (members.some(isLocked)){ setStatus('Locked · unlock to move'); return; }
  const originLead=drag.origins.find(x=>x.id===lead.id) || drag.origins[0];
  const dx=nx-originLead.x, dz=nz-originLead.z;
  const opts = lead.kind==='permanent' ? {ignoreMove:true} : {};
  slideGroupToward(members, drag.origins, dx, dz, opts);
  if (groupPoseLegal(members, opts)) drag.lastLegal = members.map(m=>({id:m.id,x:m.x,z:m.z}));
  if (lead.kind==='permanent') liveMaxPulse(members);
  render();
}
function settle(){
  clearTimeout(longPressTimer);
  if (!drag) return;
  const d=drag; drag=null;
  const it=items.find(x=>x.id===d.id); if(!it) return;
  if (isLocked(it)){ render(); return; }
  const members=groupMembers(it);
  const opts = it.kind==='permanent' ? {ignoreMove:true} : {};
  // One rule: if illegal on release → snap back to last legal pose (no spring / multi-pass)
  let illegal=false;
  for (const m of members){ if (!isLegal(m, opts)){ illegal=true; break; } }
  if (illegal){
    for (const ll of d.lastLegal){
      const m=items.find(x=>x.id===ll.id);
      if (m){ m.x=ll.x; m.z=ll.z; }
    }
  }
  if (it.type==='stage' || it.type==='dance'){
    for (const m of groupMembers(it)){
      if (it.type==='stage') snapStageDeck(m);
      else snapDanceTile(m);
    }
    if (it.type==='stage') recomputeStageGroups();
    else recomputeDanceGroups();
    invalidateFloorMax();
    const joined=groupMembers(items.find(x=>x.id===it.id)||it).length;
    const unit=it.type==='stage' ? 'decks' : 'tiles';
    const one=it.type==='stage' ? 'Stage deck' : 'Dance tile';
    setStatus(joined>1 ? ((it.type==='stage'?'Stage':'Dance')+' snapped · '+joined+' '+unit+' move as one') : one);
  }
  if (it.kind==='permanent'){
    yieldForPermanents(groupMembers(it));
    if (liveMax){ pruneIllegalTables(); fillGapsHexOnce(); renumberTables(); setGuestsFromTables(); setStatus('Live max · settled'); }
    else if (it.type!=='stage' && it.type!=='dance') setStatus('Settled');
  } else if (it.kind==='move' && it.type==='round'){
    renumberTables(); // keep # geography after shove
    invalidateFloorMax();
  }
  if (it.kind==='permanent') invalidateFloorMax();
  render();
}

const NUM_MODE_KEY = 'plan2d-table-num-mode';
let tableNumMode = (function(){
  try {
    const v = localStorage.getItem(NUM_MODE_KEY);
    if (v==='rows' || v==='ltr') return v;
  } catch {}
  return 'ltr'; // default: left→right, highest # furthest right (×10 ≈ guests)
})();
function setTableNumMode(mode){
  if (mode!=='ltr' && mode!=='rows') return;
  tableNumMode = mode;
  try { localStorage.setItem(NUM_MODE_KEY, mode); } catch {}
  document.querySelectorAll('.num-mode button').forEach(b=>{
    b.classList.toggle('on', b.dataset.num===mode);
  });
  const n = renumberTables();
  render();
  setStatus(mode==='ltr'
    ? ('Numbers L→R · #'+n+' furthest right · ×10 = '+ (n*SEATS_PER_TABLE) +' guests')
    : ('Numbers by rows · top→bottom, L→R'));
}
function renumberTables(){
  const mov = items.filter(i=>i.kind==='move' && i.type==='round');
  const rowTol = MIN_C2C * 0.45;
  const colTol = MIN_C2C * 0.45;
  if (tableNumMode === 'rows'){
    // Top→bottom rows, left→right within row. Highest often bottom-right.
    mov.sort((a,b)=>{
      if (Math.abs(a.z-b.z) > rowTol) return b.z - a.z;
      return a.x - b.x;
    });
  } else {
    // Left→right columns: furthest right = highest # (Al default — ×10 reads max).
    mov.sort((a,b)=>{
      if (Math.abs(a.x-b.x) > colTol) return a.x - b.x;
      return b.z - a.z; // same column: top → bottom
    });
  }
  mov.forEach((m,i)=>{ m.label=String(i+1); });
  seq = Math.max(seq, mov.length);
  return mov.length;
}
function setGuestsFromTables(){
  const guests = roomSeats();
  brief.people = guests ? String(guests) : '';
  applyBriefToDom();
  return guests;
}

/** Build solids for packing: built-ins + permanents + locked round AABBs. */
function packSolidsFromItems(){
  const out=[];
  holeSolids().forEach(b => out.push(b));
  doorKeepBoxes().forEach(b => out.push(b));
  SCREENS.forEach(s => {
    out.push({ x:s.x-s.w/2, z:s.z-s.d/2, w:s.w, d:s.d });
    const keepD = screenKeepDepth();
    if (keepD > 0) out.push({ x:s.x-s.w/2, z:s.z - keepD, w:s.w, d:keepD });
  });
  items.forEach(o => {
    if (o.kind==='move' && o.type==='round' && !isLocked(o)) return;
    if (o.type==='round' && isLocked(o)) {
      out.push({ x:o.x-BODY_R, z:o.z-BODY_R, w:BODY_D, d:BODY_D });
      return;
    }
    if (o.kind==='permanent') out.push(aabb(o));
  });
  return out;
}

function packPointLegal(x, z, rounds, solids, exceptIdx){
  if (!circleInPerimeter(x, z, BODY_R + WALL_AISLE)) return false;
  for (const s of solids) if (circleHitsAabb(x, z, BODY_R, s)) return false;
  const need = MIN_C2C * MIN_C2C;
  for (let i=0;i<rounds.length;i++){
    if (i===exceptIdx) continue;
    const dx=x-rounds[i].x, dz=z-rounds[i].z;
    if (dx*dx+dz*dz < need) return false;
  }
  return true;
}

/**
 * Lean Max PAX (mirrors pack-math/maxpax-core.mjs):
 * proven BEST_SEED + gap/polish, else focused hex pitch 2.92/2.88 ang=0.
 */
const BEST_SEED = [
  {x:-9.9639,z:-0.0438},{x:-7.0723,z:-0.3594},{x:5.0349,z:0.4746},{x:-8.4548,z:-2.8874},
  {x:-5.546,z:-2.8022},{x:-3.3337,z:-0.9549},{x:-1.4533,z:-3.1386},{x:0.5073,z:-1.0104},
  {x:2.425,z:-3.3263},{x:5.2777,z:-2.3956},{x:8.1091,z:-2.9725},{x:-5.5637,z:2.3098},
  {x:10.9131,z:-2.3019},{x:-11.33,z:-3.33}
];
function packUsableBox(){
  const m=BODY_R+WALL_AISLE+PAD;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  return {minX:Math.min(...xs)+m,maxX:Math.max(...xs)-m,minZ:Math.min(...zs)+m,maxZ:Math.max(...zs)-m};
}
function packGapFill(rounds, solids, box, steps, half){
  for (const step of steps){
    const offs = half ? [0, step*0.5] : [0];
    for (const oz of offs) for (const ox of offs){
      for (let z=box.minZ+oz; z<=box.maxZ+1e-9; z+=step)
        for (let x=box.minX+ox; x<=box.maxX+1e-9; x+=step)
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
    }
  }
}
function packLightPolish(rounds, solids, lockedCount, iters){
  for (let iter=0; iter<iters; iter++){
    for (let i=lockedCount;i<rounds.length;i++){
      const fx=(0-rounds[i].x)*0.02, fz=(-1.2-rounds[i].z)*0.02;
      const trials=[{x:rounds[i].x+fx,z:rounds[i].z+fz},{x:rounds[i].x+fx,z:rounds[i].z},{x:rounds[i].x,z:rounds[i].z+fz}];
      for (const t of trials){
        if (packPointLegal(t.x,t.z,rounds,solids,i)){ rounds[i]=t; break; }
      }
    }
  }
}
function packHexSync(solids, locked, opts){
  const box=packUsableBox();
  const gapStep=(opts && opts.gapStep) || 0.4;
  // Soft floor only — never early-stop; Screen keep off frees the front strip for more tables
  const target=(opts && opts.target) != null ? opts.target : (screenKeepOn ? 14 : 20);
  let best=[];
  if (!locked.length){
    const rounds=[];
    for (const p of BEST_SEED) if (packPointLegal(p.x,p.z,rounds,solids)) rounds.push({x:p.x,z:p.z});
    packGapFill(rounds, solids, box, [0.28,0.16,0.1], true);
    packLightPolish(rounds, solids, 0, 12);
    packGapFill(rounds, solids, box, [0.1,0.07], false);
    // Extra fine fill when screen keep is off — that 2.8 m strip becomes usable
    if (!screenKeepOn) packGapFill(rounds, solids, box, [0.12,0.08,0.06], true);
    best=rounds.map(t=>({x:t.x,z:t.z}));
    // Do NOT return early at target — keep searching denser layouts below
  }
  const configs=[
    {pitch:2.92,div:6},{pitch:MIN_C2C,div:6},
    {pitch:2.88,div:6}
  ];
  let bestRounds=locked.map(t=>({x:t.x,z:t.z}));
  let bestCount=0;
  for (const cfg of configs){
    const pitch=cfg.pitch, div=cfg.div, rowP=pitch*Math.sqrt(3)/2;
    for (let oi=0; oi<div; oi++) for (let oj=0; oj<div; oj++){
      const ox=(oi/div)*pitch, oz=(oj/div)*rowP;
      const rounds=locked.map(t=>({x:t.x,z:t.z}));
      for (let r=-18;r<=18;r++){
        const rs=(r&1)?pitch/2:0;
        for (let c=-18;c<=18;c++){
          const x=ox+rs+c*pitch, z=oz+r*rowP;
          if (x<box.minX-0.2||x>box.maxX+0.2||z<box.minZ-0.2||z>box.maxZ+0.2) continue;
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
        }
      }
      for (let z=box.minZ; z<=box.maxZ+1e-9; z+=gapStep)
        for (let x=box.minX; x<=box.maxX+1e-9; x+=gapStep)
          if (packPointLegal(x,z,rounds,solids)) rounds.push({x,z});
      const n=rounds.length-locked.length;
      if (n>bestCount){ bestCount=n; bestRounds=rounds; }
    }
  }
  const rounds=bestRounds.map(t=>({x:t.x,z:t.z}));
  packGapFill(rounds, solids, box, [0.22,0.12], true);
  packLightPolish(rounds, solids, locked.length, 8);
  packGapFill(rounds, solids, box, [0.08,0.06], false);
  const placed=rounds.slice(locked.length);
  if (placed.length>best.length) best=placed;
  return best;
}

function fillGapsHexOnce(){
  const solids=packSolidsFromItems();
  const locked=items.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const existing=items.filter(i=>i.kind==='move'&&i.type==='round'&&!isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const rounds=locked.concat(existing);
  const margin=BODY_R+WALL_AISLE+PAD;
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const minX=Math.min(...xs)+margin, maxX=Math.max(...xs)-margin;
  const minZ=Math.min(...zs)+margin, maxZ=Math.max(...zs)-margin;
  const step=0.4;
  let n=0;
  for (let z=minZ; z<=maxZ+1e-9; z+=step){
    for (let x=minX; x<=maxX+1e-9; x+=step){
      if (!packPointLegal(x,z,rounds,solids)) continue;
      rounds.push({x,z});
      seq++; items.push({ id:'t'+seq, kind:'move', type:'round', x, z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
      n++;
    }
  }
  return n;
}

function addUntilFull(){
  return fillGapsHexOnce();
}

function runMaxPax(){
  invalidateFloorMax();
  const kept=items.filter(i=>i.kind==='permanent' || isLocked(i));
  items=kept.slice();
  const solids=packSolidsFromItems();
  const locked=kept.filter(i=>i.type==='round' && isLocked(i)).map(t=>({x:t.x,z:t.z}));
  const placed=packHexSync(solids, locked, { gapStep: screenKeepOn ? 0.4 : 0.28, target: screenKeepOn ? 14 : 22 });
  for (const p of placed){
    seq++;
    items.push({ id:'t'+seq, kind:'move', type:'round', x:p.x, z:p.z, w:TABLE_D, d:TABLE_D, label:'', locked:false });
  }
  // Light check — drop any illegal (should be zero)
  pruneIllegalTables();
  const n=renumberTables();
  const guests=setGuestsFromTables();
  render();
  setStatus('Max PAX · '+n+' tables · '+guests+' guests');
  return n;
}

          const ms=Math.round(performance.now()-t0);
          setStatus('Max PAX · '+n+' tables · '+(n*SEATS_PER_TABLE)+' guests · '+ms+'ms');
        }
      } catch (err) {
        setStatus('Max PAX error · '+err);
        console.error(err);
      }
      btn.disabled=false;
    }, 0);
  });

  stage: { type:'stage', w:STAGE_DECK.w, d:STAGE_DECK.d, label:'Stage', group:null },

};
function clearPlaceKit(){
  placeKit=null;
  document.querySelectorAll('[data-kit]').forEach(b=>b.classList.remove('armed'));
  document.querySelectorAll('.kit-details').forEach(d=>d.open=false);
  svg.style.cursor='';
}
function armPlaceKit(kind){

  document.querySelectorAll('[data-kit]').forEach(b=>b.classList.toggle('armed', b.dataset.kit===kind));
  setStatus('Click map to place · Esc cancel');
  svg.style.cursor='crosshair';
}
function nextStageAnchor(){
  const decks=items.filter(i=>i.type==='stage' && i.group==='stage');
  if (!decks.length) return { x:0, z:STAGE_Z };
  decks.sort((a,b)=>a.x-b.x);
  const right=decks[decks.length-1];
  return { x:right.x + deckPitch, z:right.z };
}
function stampKitAt(kind, x, z){
  invalidateFloorMax();
  const def=KIT_DEFS[kind];
  if (!def) return;
  seq++;
  let it;
  if (kind==='stage'){
    stageSeq++;
    it = makeStageDeck('stage'+stageSeq, x, z);
    it = fitPermanentIntoPerimeter(it);
    // snap to nearby decks on place
    snapStageDeck(it);
    recomputeStageGroups();
  } else if (kind==='dance'){
    danceSeq++;
    it = makeDanceTile('dance'+danceSeq, x, z);
    it = fitPermanentIntoPerimeter(it);
    snapDanceTile(it);
    recomputeDanceGroups();
  } else {
    it = { id:kind+seq, kind:'permanent', type:def.type, x, z, w:def.w, d:def.d, label:def.label, locked:false };
    it = fitPermanentIntoPerimeter(it);
  }
  items.push(it);
  yieldOverlappingOnly(it);
  untangleTables();
  if (liveMax){ addUntilFull(); renumberTables(); }
  selectedId=it.id;
  selectedSeat=null;
  clearPlaceKit();
  render();
  setStatus('Placed · '+kitLabel(it));
}

/** Big stuff first: Style → Banquet / with 1–3 stage / + dance. Replaces stage+dance only; tables stay. */
function parseBanquetStyle(val){
  const m = String(val||'').match(/^banquet(?:-s([123]))?(-dance)?$/);
  if (!m) return null;
  return { stages: m[1] ? Number(m[1]) : 0, dance: !!m[2] };
}
const STD_KEY = 'plan2d-banquet-standards-v1';
function loadStandards(){ try { return JSON.parse(localStorage.getItem(STD_KEY)||'[]'); } catch { return []; } }

function ensureStylePreset(sel, value, label, afterValue){
  if ([...sel.options].some(o=>o.value===value)) return;

  o.value=value; o.textContent=label; o.dataset.preset='1';
  const after = [...sel.options].find(opt=>opt.value===afterValue);
  if (after && after.nextSibling) sel.insertBefore(o, after.nextSibling);
  else if (after) sel.appendChild(o);
  else sel.appendChild(o);
}
function refreshStyleSelects(){

function saveBanquetStandard(){

/* Prototype: per left-rail field type (size + bold) — not product */
(function fieldTypeControls(){
  const KEY='plan2d-field-type-v1';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function save(map){ localStorage.setItem(KEY, JSON.stringify(map)); }
  function keyFor(el){
    const pane = el.closest('.rail-pane');
    const pid = pane && pane.dataset.pane ? pane.dataset.pane : 'x';
    const name = el.dataset.field || el.dataset.typekey || 'row';
    return pid + ':' + name;
  }
  function applyTo(el, st){
    const px = st.px || 13;
    const w = st.bold ? '700' : '500';
    el.style.fontSize = px + 'px';
    el.style.fontWeight = w;
    el.querySelectorAll('label, .q, .tiny-lab, .fixed, input, select, .n, summary, .quiet-btn, .type-row-main').forEach(n=>{
      n.style.fontSize = 'inherit';
      n.style.fontWeight = 'inherit';
    });
    const boldBtn = el.querySelector('.field-type [data-act="bold"]');
    if (boldBtn) boldBtn.classList.toggle('on', !!st.bold);
    const pxEl = el.querySelector('.field-type .px');
    if (pxEl) pxEl.textContent = String(px);
  }
  function ensureChip(el){
    if (el.querySelector(':scope > .field-type')) return;
    const chip = document.createElement('div');
    chip.className = 'field-type';
    chip.title = 'Type for this row — prototype';
    chip.innerHTML = '<button type="button" data-act="down">A−</button>'
      + '<span class="px" aria-label="Font size">13</span>'
      + '<button type="button" data-act="up">A+</button>'
      + '<button type="button" data-act="bold">B</button>';
    chip.addEventListener('mousedown', e=>e.stopPropagation());
    chip.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      const act = e.target && e.target.dataset && e.target.dataset.act;
      if (!act) return;
      const map = load();
      const k = keyFor(el);
      const st = Object.assign({ px:13, bold:true }, map[k]||{});
      if (act==='down') st.px = Math.max(11, (st.px||13)-1);
      if (act==='up') st.px = Math.min(24, (st.px||13)+1);
      if (act==='bold') st.bold = !st.bold;
      map[k]=st; save(map); applyTo(el, st);
      const pane = el.closest('.rail-pane');
      const pid = pane && pane.dataset.pane;
      if ((pid==='5' || pid==='6') && typeof window.__plan2dOnLocalPrefChange === 'function'){
        window.__plan2dOnLocalPrefChange(pid==='5' ? 'zeus' : 'ebby');
      }
    });
    el.appendChild(chip);
    applyTo(el, Object.assign({ px:13, bold:true }, load()[keyFor(el)]||{}));
  }
  function promote(sel, typekey){
    document.querySelectorAll(sel).forEach(el=>{
      if (!el.dataset.typekey) el.dataset.typekey = typekey;
      el.classList.add('type-row');
      // wrap children except chip into main if needed for grid
      if (!el.querySelector(':scope > .type-row-main') && !el.classList.contains('rail-field')){
        const main=document.createElement('div');
        main.className='type-row-main';
        while (el.firstChild && !(el.firstChild.classList && el.firstChild.classList.contains('field-type'))){
          // careful - only move non-chip
          const c=el.firstChild;
          if (c.classList && c.classList.contains('field-type')) break;
          main.appendChild(c);
        }
        el.insertBefore(main, el.firstChild);
      }
      ensureChip(el);
    });
  }
  function wireAll(){
    document.querySelectorAll('.rail-field[data-field]').forEach(ensureChip);
    // Add… / Place… rows
    document.querySelectorAll('.rail-pane > .add-wrap, .rail-pane .card > .add-wrap').forEach((el,i)=>{
      el.dataset.typekey = el.dataset.typekey || 'add';
      el.classList.add('type-row');
      ensureChip(el);
    });
    // Live max / Max PAX / Screen keep / Clear tools
    document.querySelectorAll('.rail-pane > .rail-tools').forEach(el=>{
      el.dataset.typekey = el.dataset.typekey || 'tools';
      el.classList.add('type-row');
      ensureChip(el);
    });
  }
  function refreshAll(){
    document.querySelectorAll('.rail-field[data-field], .rail-pane .type-row').forEach(el=>{
      applyTo(el, Object.assign({ px:13, bold:true }, load()[keyFor(el)]||{}));
    });
  }
  wireAll();
  window.__wireFieldTypeControls = wireAll;
  window.__plan2dRefreshFieldTypes = refreshAll;
  const _rb = window.__rebuildMyUi;
  if (typeof _rb === 'function'){
    window.__rebuildMyUi = function(){ _rb(); wireAll(); };
  }
})();

function catalogRoom(id){
  const cat = window.PLAN2D_ROOMS || {};
  return cat[id] || cat.grand || null;
}
function layoutCtx(){
  const stages = items.filter(i=>i.type==='stage').map(i=>({
    x:i.x - i.w/2, z:i.z - i.d/2 - (window.Plan2dLayouts?Plan2dLayouts.INDUSTRY.cabaretStageExtra:1.2),
    w:i.w, d:i.d + (window.Plan2dLayouts?Plan2dLayouts.INDUSTRY.cabaretStageExtra:1.2)
  }));
  const extra = items.filter(i=>i.kind==='permanent' && i.type!=='stage' && i.type!=='dance').map(i=>aabb(i));
  return {
    room: ROOM, holes: HOLES, doors: DOORS, screens: SCREENS,
    screenKeep: !!screenKeepOn, throwOn: !!throwOn,
    blocks: stages.concat(extra)
  };
}
function stylePackPreview(){
  if (!window.Plan2dLayouts) return null;
  return Plan2dLayouts.packStyle(brief.style, layoutCtx());
}
function snapshotEventRoom(id){
  eventByRoom[id || currentRoomId] = {
    items: items.map(i=>({...i, removedSeats: Array.isArray(i.removedSeats)?i.removedSeats.slice():undefined})),
    style: brief.style,
    people: brief.people,
    screenKeepOn: !!screenKeepOn,
    throwOn: !!throwOn,
    projectorsOn: !!projectorsOn
  };
}
function fitRoomView(id){
  if (id==='grand'){ OX=GRAND_VIEW.OX; OY=GRAND_VIEW.OY; S=GRAND_VIEW.S; applyZoom(); return; }
  const xs=ROOM.map(p=>p[0]), zs=ROOM.map(p=>p[1]);
  const L=Math.max(...xs)-Math.min(...xs), W=Math.max(...zs)-Math.min(...zs);
  S = Math.min(36, Math.max(16, Math.min((BASE_VB.w-90)/Math.max(L,1), (BASE_VB.h-90)/Math.max(W,1))));
  OX = BASE_VB.w/2;
  OY = BASE_VB.h/2 + 8;
  applyZoom();
}
function applyRoomEnvelope(id){
  const spec = catalogRoom(id);
  if (!spec) return;
  ROOM = spec.room.map(p=>[p[0],p[1]]);
  HOLES = (spec.holes||[]).map(h=>({...h}));
  DOORS = (spec.doors||[]).map(d=>({ kind:d.kind, a:d.a.slice(), b:d.b.slice(), label:d.label }));
  NEIGHBOURS = (spec.neighbours||[]).map(n=>({ label:n.label, pts:n.pts.map(p=>[p[0],p[1]]) }));
  SCREENS = (spec.screens||[]).map(s=>({...s}));
}
function setRoom(id, opts){
  const spec = catalogRoom(id);
  if (!spec){ setStatus('Unknown room'); return; }
  if (!(opts && opts.skipSave)) snapshotEventRoom(currentRoomId);
  currentRoomId = id;
  applyRoomEnvelope(id);
  const saved = eventByRoom[id];
  if (saved && !(opts && opts.fresh)){
    items = (saved.items||[]).map(i=>({...i}));
    brief.style = saved.style || brief.style;
    brief.people = saved.people || brief.people;
    if (typeof saved.screenKeepOn==='boolean') screenKeepOn = saved.screenKeepOn;
    if (typeof saved.throwOn==='boolean') throwOn = saved.throwOn;
    if (typeof saved.projectorsOn==='boolean') projectorsOn = saved.projectorsOn;
    stageSeq = items.filter(i=>i.type==='stage').length;
    danceSeq = items.filter(i=>i.type==='dance').length;
    seq = Math.max(seq, items.length);
  } else if (!(opts && opts.keepItems)){
    items = [];
    selectedId=null; selectedSeat=null; seq=0; stageSeq=0; danceSeq=0;
    if (opts && opts.fresh) brief.people = '';
  }
  fitRoomView(id);
  document.querySelectorAll('.sync-room').forEach(el=>{ if (el.value!==id) el.value=id; });
  document.querySelectorAll('.rail-pane[data-pane="5"] [data-field="room"] .fixed, .rail-pane[data-pane="6"] [data-field="room"] .fixed').forEach(el=>{
    el.textContent = spec.name.replace('Grand Ballroom','Grand').replace('Grand Ballroom ','');
  });
  const top = document.querySelector('.top strong');
  if (top) top.textContent = spec.name.toUpperCase()+' · PLAN 2D';
  applyBriefToDom();
  syncThrowButtons();
  if (typeof recomputeStageGroups==='function') recomputeStageGroups();
  if (typeof recomputeDanceGroups==='function') recomputeDanceGroups();
  invalidateFloorMax();
  render();
  setTimeout(()=>{ recomputeFloorMaxAlgo(); updateCounts(); }, 0);
  setStatus(spec.name+' · '+spec.L+' × '+spec.W+' m');
}
function applyLayoutItems(packed, extras){
  extras = extras || {};
  const keep = items.filter(i=>i.kind==='permanent' && (extras.keepStage ? true : (i.type!=='stage' && i.type!=='dance')));
  if (extras.stripStage) {
    items = keep.filter(i=>i.type!=='stage' && i.type!=='dance');
  } else {
    items = keep.slice();
  }
  (packed.tables||[]).forEach((t,i)=>{
    seq++;
    items.push(Object.assign({ id:t.id||('t'+seq), kind:'move', locked:false, label:t.label||'' }, t));
  });
  (packed.chairs||[]).forEach((c,i)=>{
    seq++;
    items.push(Object.assign({ id:c.id||('ch'+seq), kind:'move', locked:false }, c));
  });
  if (typeof renumberTables==='function') renumberTables();
  brief.people = String(packed.guests||roomSeats());
  applyBriefToDom();
  recomputeFloorMaxAlgo();
  render();
}
function applyStyleMax(styleVal){
  const s = String(styleVal||brief.style||'');
  brief.style = s;
  applyBriefToDom();
  if (s.indexOf('banquet')===0){
    runMaxPax();
    return;
  }
  if (!window.Plan2dLayouts){ setStatus('Layouts missing'); return; }
  const packed = Plan2dLayouts.packStyle(s, layoutCtx());
  if (!packed){ setStatus('No packer for '+s); return; }
  const spec = catalogRoom(currentRoomId);
  const sid = s.replace(/-max$/,'');
  const cap = spec && spec.caps ? spec.caps[sid] : null;
  if (cap && packed.chairs && packed.chairs.length > cap){
    packed.chairs = packed.chairs.slice(0, cap);
    packed.guests = packed.chairs.length;
  }
  if (cap && packed.tables && packed.tables.length && sid==='cabaret' && packed.tables.length * 8 > cap){
    packed.tables = packed.tables.slice(0, Math.floor(cap/8));
    packed.guests = packed.tables.length * 8;
  }
  applyLayoutItems(packed, { stripStage: s.indexOf('classroom')===0 || s.indexOf('theatre')===0 });
  setStatus((packed.style||s)+' · Standard max · '+packed.guests+' pax'+(cap?' · cap '+cap:''));
}

function applyBanquetBigStuff(styleVal){
  invalidateFloorMax();
  // Saved Banquet standard template
  if (String(styleVal||'').startsWith('banquet-std:')){
    const id = String(styleVal).slice('banquet-std:'.length);
    const std = loadStandards().find(x=>x.id===id);
    if (!std){ setStatus('Standard missing'); return; }
    applyStandardSnapshot(std);
    return;
  }
  const spec = parseBanquetStyle(styleVal);
  if (!spec){
    const s = String(styleVal||'');
    if (/-max$/.test(s) || s==='u-shape' || s==='u-shape-max'){
      applyStyleMax(s);
      return;
    }
    // cabaret/classroom/theatre — leave map; just record style (then Standard max to pack)
    return;
  }
  // Strip prior stage + dance only
  items = items.filter(i => i.type !== 'stage' && i.type !== 'dance');
  selectedId=null; selectedSeat=null;
  stageSeq = 0;
  danceSeq = 0;
  if (spec.stages > 0){
    const n = spec.stages;
    const startX = -((n - 1) / 2) * deckPitch;
    for (let i=0;i<n;i++){
      stageSeq++;
      items.push(makeStageDeck('stage'+stageSeq, startX + i*deckPitch, STAGE_Z));
    }
  }
  if (spec.dance){
    const n = BANQUET_DANCE_N;
    const startX = -((n - 1) / 2) * dancePitch;
    const startZ = -2.2 - ((n - 1) / 2) * dancePitch;
    for (let r=0;r<n;r++){
      for (let c=0;c<n;c++){
        danceSeq++;
        items.push(makeDanceTile('dance'+danceSeq, startX + c*dancePitch, startZ + r*dancePitch));
      }
    }
  }
  if (typeof recomputeStageGroups === 'function') recomputeStageGroups();
  if (typeof recomputeDanceGroups === 'function') recomputeDanceGroups();
  const bits=[];
  if (spec.stages) bits.push(spec.stages+' stage');
  if (spec.dance) bits.push('dance');
  yieldForPermanents(items.filter(i => i.type==='stage' || i.type==='dance'));
  untangleTables();
  setStatus(bits.length ? ('Banquet · '+bits.join(' + ')) : 'Banquet · empty (add stage/dance in Style)');
  render();
}

(function freezeOwnerPanes(){
  const OWNERS = ['5','6'];
  const ORDER_KEY = 'plan2d-rail-field-order';
  function loadOrder(){ try { return JSON.parse(localStorage.getItem(ORDER_KEY)||'{}'); } catch { return {}; } }
  function saveOrder(map){ localStorage.setItem(ORDER_KEY, JSON.stringify(map)); }
  // Migrate old date-room → date,room if present in saved order
  const map = loadOrder();
  let dirty=false;
  OWNERS.forEach(pid=>{
    const ord = map[pid];
    if (!ord || !ord.length) return;
    const next=[];
    ord.forEach(id=>{
      if (id==='date-room'){ next.push('date','room'); dirty=true; }
      else next.push(id);
    });
    map[pid]=next;
  });
  if (dirty) saveOrder(map);
})();

/* Left-rail field reorder — all UIs; order kept per pane */
(function initRailFieldDrag(){
  const KEY = 'plan2d-rail-field-order';
  function load(){ try { return JSON.parse(localStorage.getItem(KEY)||'{}'); } catch { return {}; } }
  function save(map){ localStorage.setItem(KEY, JSON.stringify(map)); }
  function fieldsIn(root){ return [...root.querySelectorAll(':scope > .rail-field')]; }
  function applyOrder(root, paneId, map){
    const order = map[paneId];
    if (!order || !order.length) return;
    const by = Object.fromEntries(fieldsIn(root).map(el => [el.dataset.field, el]));
    order.forEach(id => { if (by[id]) root.appendChild(by[id]); });
    // keep non-fields after: move tools/status back? appendChild fields only reorders among themselves if we insert before first non-field
  }
  function normalize(root){
    // Keep rail-fields as a contiguous block at their natural zone: before details/tools/staff
    const fields = fieldsIn(root);
    if (!fields.length) return;
    const anchor = [...root.children].find(el => !el.classList.contains('rail-field') && (
      el.classList.contains('rail-tools') || el.classList.contains('add-wrap') || el.classList.contains('staff') || el.tagName==='DETAILS' || el.classList.contains('count') || el.classList.contains('status-line') || el.classList.contains('sum')
    ));
    // For UI3 card: sum is first — leave sum, reorder fields, leave details at end
    fields.forEach(f => {
      if (anchor) root.insertBefore(f, anchor);
      else root.appendChild(f);
    });
  }
  function persist(root, paneId){
    const map = load();
    map[paneId] = fieldsIn(root).map(el => el.dataset.field);
    save(map);
    if ((paneId==='5' || paneId==='6') && typeof window.__plan2dOnLocalPrefChange === 'function'){
      window.__plan2dOnLocalPrefChange(paneId==='5' ? 'zeus' : 'ebby');
    }
  }
  function applySavedOrder(root, paneId, map){
    const order = map[paneId];
    if (!order || !order.length) return;
    const by = Object.fromEntries(fieldsIn(root).map(el => [el.dataset.field, el]));
    const firstNon = [...root.children].find(el => !el.classList.contains('rail-field') && !el.classList.contains('sum'));
    order.forEach(id => {
      const el = by[id];
      if (!el) return;
      if (firstNon) root.insertBefore(el, firstNon);
      else root.appendChild(el);
    });
  }
  window.__plan2dApplyRailOrder = function(paneId, order){
    const pane = document.querySelector('.rail-pane[data-pane="'+paneId+'"]');
    if (!pane) return;
    const root = pane.querySelector('.card') || pane;
    const map = load();
    if (order) map[paneId] = order;
    applySavedOrder(root, paneId, map);
  };
  document.querySelectorAll('.rail-pane').forEach(pane => {
    const paneId = pane.dataset.pane || 'x';
    const roots = pane.querySelector('.card') ? [pane.querySelector('.card')] : [pane];
    roots.forEach(root => {
      const map = load();
      applySavedOrder(root, paneId, map);
      let dragEl = null;
      root.querySelectorAll(':scope > .rail-field').forEach(field => {
        field.addEventListener('dragstart', e => {
          if (e.target.closest('input,select,textarea,button')) { e.preventDefault(); return; }
          dragEl = field;
          field.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try { e.dataTransfer.setData('text/plain', field.dataset.field||''); } catch {}
        });
        field.addEventListener('dragend', () => {
          field.classList.remove('dragging');
          root.querySelectorAll('.drag-over').forEach(x => x.classList.remove('drag-over'));
          dragEl = null;
          persist(root, paneId);
        });
        field.addEventListener('dragover', e => {
          e.preventDefault();
          if (!dragEl || dragEl===field) return;
          field.classList.add('drag-over');
          const rect = field.getBoundingClientRect();
          const before = (e.clientY - rect.top) < rect.height/2;
          if (before) root.insertBefore(dragEl, field);
          else root.insertBefore(dragEl, field.nextSibling);
        });
        field.addEventListener('dragleave', () => field.classList.remove('drag-over'));
        field.addEventListener('drop', e => { e.preventDefault(); field.classList.remove('drag-over'); });
      });
    });
  });
})();

  function jpegToPdf(pages, w, h){
    // Minimal PDF 1.4 with one JPEG per page (letterhead already rasterised).
    const parts = [];
    const enc = new TextEncoder();
    function push(s){ parts.push(typeof s==='string' ? enc.encode(s) : s); }
    const objs = [];
    function addObj(bytes){ objs.push(bytes); return objs.length; }
    const pageIds = [];
    const imgIds = [];
    pages.forEach((jpeg, i)=>{
      const img = addObj(null);
      imgIds.push(img);
    });
    // We'll assemble after we know sizes
    let body = '%PDF-1.4\n';
    const offsets = [0];
    function emit(str, bin){
      offsets.push(body.length);
      if (bin){
        // handled below
      }
      body += str;
    }
    // Simpler: one object stream builder
    const chunks = [];
    let pos = 0;
    function write(u8){
      chunks.push(u8);
      pos += u8.length;
    }
    function writeStr(s){ write(enc.encode(s)); }
    writeStr('%PDF-1.4\n');
    const xref = [0];
    function obj(n, payload){
      xref[n] = pos;
      writeStr(n+' 0 obj\n');
      if (payload instanceof Uint8Array){
        write(payload);
      } else {
        writeStr(payload);
      }
      writeStr('\nendobj\n');
    }
    const kids = [];
    const contentIds = [];
    pages.forEach((_, i)=>{
      kids.push(3+i*3);
      contentIds.push(4+i*3);
    });
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Count '+pages.length+' /Kids ['+kids.map(k=>k+' 0 R').join(' ')+'] >>');
    pages.forEach((jpeg, i)=>{
      const pageNo = 3+i*3;
      const contNo = 4+i*3;
      const imgNo = 5+i*3;
      const stream = enc.encode('q '+w+' 0 0 '+h+' 0 0 cm /Im'+i+' Do Q\n');
      obj(pageNo, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+w+' '+h+'] /Resources << /XObject << /Im'+i+' '+imgNo+' 0 R >> >> /Contents '+contNo+' 0 R >>');
      obj(contNo, '<< /Length '+stream.length+' >>\nstream\n'+new TextDecoder().decode(stream)+'endstream');
      const head = enc.encode('<< /Type /XObject /Subtype /Image /Width '+Math.round(w)+' /Height '+Math.round(h)+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');
      const tail = enc.encode('\nendstream');
      xref[imgNo] = pos;
      writeStr(imgNo+' 0 obj\n');
      write(head); write(jpeg); write(tail); writeStr('\nendobj\n');
    });
    const xrefStart = pos;
    writeStr('xref\n0 '+(xref.length)+'\n');
    writeStr('0000000000 65535 f \n');
    for (let i=1;i<xref.length;i++){
      writeStr(String(xref[i]||0).padStart(10,'0')+' 00000 n \n');
    }
    writeStr('trailer << /Size '+xref.length+' /Root 1 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');
    let total = 0;
    chunks.forEach(c=>total+=c.length);
    const out = new Uint8Array(total);
    let o=0;
    chunks.forEach(c=>{ out.set(c,o); o+=c.length; });
    return new Blob([out], {type:'application/pdf'});
  }
  async function rasterSheet(){
    const wrap = document.createElement('div');

    const canvas = document.createElement('canvas');

    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f7f3ea';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(2,2);
    // Draw logos + text, then SVG
    await new Promise((resolve)=>{
      const imgs = wrap.querySelectorAll('img');
      let n = imgs.length || 0;
      if (!n) resolve();
      imgs.forEach(img=>{
        if (img.complete) { if (--n<=0) resolve(); }
        else img.onload = img.onerror = ()=>{ if (--n<=0) resolve(); };
      });
      setTimeout(resolve, 400);
    });
    try {
      const svg = wrap.querySelector('svg');
      ctx.fillStyle = '#f7f3ea';
      ctx.fillRect(0,0,w,80);
      const myles = wrap.querySelector('.pdf-head img');
      const qt = wrap.querySelector('.pdf-head img.qt');
      if (myles && myles.naturalWidth) ctx.drawImage(myles, 16, 14, 120, 40);
      if (qt && qt.naturalWidth) ctx.drawImage(qt, w-136, 12, 120, 44);
      const m = sheetMeta();
      ctx.fillStyle = '#1a1612';
      ctx.font = '700 20px ui-sans-serif,system-ui,sans-serif';
      ctx.fillText((m.date?m.date+' · ':'')+(m.client||m.hotel), 150, 36);
      ctx.font = '500 13px ui-sans-serif,system-ui,sans-serif';
      ctx.fillStyle = '#6a6458';
      ctx.fillText(m.room+'  ·  '+m.sub, 150, 58);
      if (svg){
        const xml = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([xml], {type:'image/svg+xml;charset=utf-8'});

        await new Promise((resolve)=>{
          const im = new Image();
          im.onload = ()=>{ ctx.drawImage(im, 16, 88, w-32, h-104); URL.revokeObjectURL(url); resolve(); };
          im.onerror = ()=>{ URL.revokeObjectURL(url); resolve(); };
          im.src = url;
        });
      }
    } finally {
      wrap.remove();
    }
    const jpeg = await new Promise((resolve)=>canvas.toBlob(b=>resolve(b), 'image/jpeg', 0.92));
